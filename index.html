  const estT = estadoTreino(D), treinoOk = estT === 'feito';
  const bal = t.kcal - gd.total;
  const sn = sonoDe(D);

  /* comparação com os 7 dias anteriores, para o número de hoje ter contexto */
  const ant = [];
  for (let i = 1; i <= 7; i++) { const d = addDays(D, -i); if (DB.dias[d] && !diaVazio(DB.dias[d])) ant.push(d); }
  const md = f => ant.length ? ant.reduce((a, d) => a + f(d), 0) / ant.length : 0;
  const mKcal = md(d => somaDia(d).kcal), mAgua7 = md(d => DB.dias[d].agua || 0), mVol = md(d => volDia(d));
  const dif = (v, base) => !base ? '' : `<span class="trend ${v >= base ? 'up' : 'down'}">${v >= base ? '▲' : '▼'} ${n0(Math.abs(v - base) / base * 100)}%</span>`;

  /* refeições do dia */
  const refDia = REFS.map(r => [r, somaItens(x.refeicoes[r[0]] || [])]).filter(r => r[1].kcal > 0);
  const maiorRef = Math.max(1, ...refDia.map(r => r[1].kcal));

  return dateStrip() + `<div class="card">
    <div class="ch"><h2>${esc(dLabel(D))}</h2><span class="sub">visão geral</span></div>
    <div style="display:flex;justify-content:space-around;text-align:center">
      <div>${ring(treinoOk ? 1 : estT === 'aberto' ? .4 : estT === 'falta' ? 1 : 0,
        estT === 'falta' ? 'var(--bad)' : 'var(--tre)', 62, treinoOk ? '✓' : estT === 'falta' ? '✕' : '—')}
        <div class="mini" style="margin-top:4px">${estT === 'falta' ? 'Falta' : 'Treino'}</div></div>
      <div>${ring(t.kcal / m.kcal, 'var(--die)', 62, n0(t.kcal / m.kcal * 100) + '%')}
        <div class="mini" style="margin-top:4px">Dieta</div></div>
      <div>${ring((x.agua || 0) / metaAguaDia(D), 'var(--agua)', 62, n1((x.agua || 0) / 1000) + 'L')}
        <div class="mini" style="margin-top:4px">Água</div></div>
      <div>${ring(habs.length ? hf / habs.length : 0, 'var(--hab)', 62, `${hf}/${habs.length}`)}
        <div class="mini" style="margin-top:4px">Hábitos</div></div>
      <div>${ring(sn ? sonoMin(sn) / (metaSono() * 60) : 0, 'var(--res)', 62, sn ? n1(sonoHoras(sn)) + 'h' : '—')}
        <div class="mini" style="margin-top:4px">Sono</div></div>
    </div>
    ${ant.length ? `<div class="sec-title" style="margin:16px 4px 8px">Comparado com a sua média dos últimos ${ant.length} dias</div>
      <div class="row"><div class="g"><div class="t">Calorias</div>
        <div class="s">média ${n0(mKcal)} kcal</div></div><div class="v">${n0(t.kcal)} ${dif(t.kcal, mKcal)}</div></div>
      <div class="row"><div class="g"><div class="t">Água</div>
        <div class="s">média ${n1(mAgua7 / 1000)} L</div></div><div class="v">${n1((x.agua || 0) / 1000)} L ${dif(x.agua || 0, mAgua7)}</div></div>
      ${mVol ? `<div class="row"><div class="g"><div class="t">Volume de treino</div>
        <div class="s">média ${n0(mVol)} kg</div></div><div class="v">${n0(volDia(D))} kg ${dif(volDia(D), mVol)}</div></div>` : ''}`
      : '<p class="mini" style="margin-top:12px">A partir de alguns dias lançados, este cartão passa a comparar o dia de hoje com a sua própria média.</p>'}
  </div>

  <div class="card">
    <div class="ch"><h2>Balanço energético</h2>
      <span class="pill ${bal < -50 ? 'ok' : bal > 50 ? 'esc' : 'mut'}">${bal > 0 ? '+' : ''}${n0(bal)} kcal</span></div>
    <div class="kpi">
      <div><b style="color:var(--die)">${n0(t.kcal)}</b><span>consumido</span></div>
      <div><b style="color:var(--tre)">${n0(gd.total)}</b><span>gasto est.</span></div>
      <div><b>${n0(gd.extra)}</b><span>exercício</span></div>
    </div>
    <p class="mini" style="margin-top:9px">Gasto = TMB × atividade${num(DB.perfil.gastoExtra) ? ' + adicional fixo' : ''} (${n0(gd.base)} kcal) + treino e esportes lançados (${n0(gd.extra)} kcal)${gd.ajuste ? ` + ajuste de hoje (${n0(gd.ajuste)} kcal)` : ''}.
      ${bal < 0 ? 'Você está em déficit hoje.' : bal > 0 ? 'Você está em superávit hoje.' : 'Você está no equilíbrio.'}</p>
    <button class="btn gh full sm" style="margin-top:10px" data-a="ajustesHoje">${ic('raio',15)} Ajustes de hoje</button>
  </div>

  <div class="card">
    <div class="ch"><h2>Macronutrientes</h2><span class="sub">${n0(t.kcal)} / ${n0(m.kcal)} kcal</span></div>
    <div class="macro" style="flex-direction:column;gap:10px">
      ${[['Carboidrato', t.c, m.c, 'var(--carb)'], ['Proteína', t.p, m.p, 'var(--prot)'], ['Gordura', t.g, m.g, 'var(--gord)']].map(r =>
    `<div><div class="mt"><span>${r[0]}</span><span>${n1(r[1])} / ${n0(r[2])} g</span></div>${bar(r[1], r[2], r[3])}</div>`).join('')}
    </div>
    ${t.kcal ? `<div class="mini" style="margin-top:11px">Divisão de hoje:
      ${n0(t.c * 4 / t.kcal * 100)}% carboidrato · ${n0(t.p * 4 / t.kcal * 100)}% proteína ·
      ${n0(t.g * 9 / t.kcal * 100)}% gordura. Alvo do seu plano:
      ${n0(m.c * 4 / m.kcal * 100)}/${n0(m.p * 4 / m.kcal * 100)}/${n0(m.g * 9 / m.kcal * 100)}.</div>` : ''}
    ${t.escape ? `<div class="warnbox" style="margin:11px 0 0">Escapes hoje: <b>${n0(t.escape)} kcal</b> (${n0(t.kcal ? t.escape / t.kcal * 100 : 0)}% do total).</div>` : ''}
  </div>

  ${refDia.length ? `<div class="card">
    <div class="ch"><span class="dot" style="background:var(--die)"></span><h2>Refeições de hoje</h2>
      <span class="sub">${refDia.length} refeição(ões)</span></div>
    ${refDia.map(([r, s]) => `<div style="margin-bottom:9px">
      <div class="mt"><span>${ic(r[2], 13)} ${r[1]}</span>
        <span>${n0(s.kcal)} kcal · ${n0(t.kcal ? s.kcal / t.kcal * 100 : 0)}%</span></div>
      ${bar(s.kcal, maiorRef, r[0] === 'livre' ? 'var(--warn)' : 'var(--die)')}
      <div class="mini">C ${n0(s.c)}g · P ${n0(s.p)}g · G ${n0(s.g)}g</div></div>`).join('')}
  </div>` : ''}

  ${faltaDoDia(D) ? `<div class="card">
    <div class="ch"><span class="dot" style="background:var(--bad)"></span><h2>Sem treino</h2>
      <span class="pill bad">falta</span></div>
    <p class="mini">${esc(faltaDoDia(D).motivo)}${faltaDoDia(D).obs && faltaDoDia(D).obs !== faltaDoDia(D).motivo ? ' — ' + esc(faltaDoDia(D).obs) : ''}</p>
  </div>` : ''}
  ${treinoDoDia(D) ? `<div class="card">
    <div class="ch"><span class="dot" style="background:var(--tre)"></span><h2>${esc(x.treino.nome)}</h2>
      <span class="sub">${x.treino.duracao || 0} min</span></div>
    <div class="kpi">
      <div><b>${x.treino.itens.filter(i => i.feito).length}/${x.treino.itens.length}</b><span>exercícios</span></div>
      <div><b>${n0(volDia(D))}</b><span>kg volume</span></div>
      <div><b>${n0(x.treino.itens.reduce((a, i) => a + i.sets.length, 0))}</b><span>séries</span></div>
    </div></div>` : ''}

  ${(() => {
    const st = medStats(D), sn = medsSN(D);
    const avulsas = sn.reduce((a, mm) => a + ((medsDe(D)[mm.id] || {}).tomados || []).length, 0);
    if (!st.prev && !avulsas) return '';
    return `<div class="card">
      <div class="ch"><span class="dot" style="background:var(--lem)"></span><h2>Medicamentos</h2>
        <span class="pill ${st.prev && st.tom >= st.prev ? 'ok' : st.tom ? 'mut' : 'bad'}">${st.tom}/${st.prev} doses</span></div>
      ${st.prev ? bar(st.tom, st.prev, 'var(--lem)') : ''}
      <p class="mini" style="margin-top:9px">${st.prev
        ? (st.tom >= st.prev ? 'Tudo em dia.' : `Faltaram ${st.prev - st.tom} dose(s) previstas.`)
        : 'Sem doses programadas.'}${avulsas ? ` ${avulsas} dose(s) "se precisar" registradas.` : ''}</p>
    </div>`;
  })()}

  ${sn ? `<div class="card">
    <div class="ch"><span class="dot" style="background:var(--res)"></span><h2>Sono</h2>
      <span class="pill ${sonoNota(sn) >= 70 ? 'ok' : sonoNota(sn) >= 45 ? 'mut' : 'bad'}">${n0(sonoNota(sn))}/100</span></div>
    <div class="kpi">
      <div><b style="color:var(--res)">${hhmm(sonoMin(sn))}</b><span>de sono</span></div>
      <div><b>${sn.qual ? sn.qual + '/5' : '—'}</b><span>qualidade</span></div>
      <div><b style="color:${sn.despertares ? 'var(--warn)' : 'var(--ac)'}">${sn.despertares || 0}</b><span>despertares</span></div>
    </div>
    ${bar(sonoMin(sn), metaSono() * 60, 'var(--res)')}
    <p class="mini" style="margin-top:9px">Deitou ${esc(sn.deitou)} · acordou ${esc(sn.acordou)} ·
    meta ${n1(metaSono())} h.${sn.nota ? ' ' + esc(sn.nota) : ''}</p>
    <button class="btn gh full sm" style="margin-top:10px" data-a="registrarSono">${ic('lapis', 15)} Editar o sono desta noite</button>
  </div>` : ''}

  <div class="card">
    <div class="ch"><h2>Registro do dia</h2></div>
    <div class="grid2">
      <div class="f" style="margin:0"><label>Peso (kg)</label>
        <input class="in" id="d_peso" type="number" inputmode="decimal" step="0.1" value="${x.peso || ''}" data-ch="salvarPeso" placeholder="—"></div>
      <div class="f" style="margin:0"><label>Como foi o dia</label>
        <input class="in" id="d_nota" value="${esc(x.nota || '')}" data-ch="salvarNota" placeholder="anotação livre"></div>
    </div>
  </div>`;
}
ACT.salvarPeso = e => { const x = dia(D); x.peso = num(e.value) || null; tocaDia(D); save(); toast('Peso registrado'); };
ACT.salvarNota = e => { const x = dia(D); x.nota = e.value; tocaDia(D); save(); };

function resumoMes() {
  const ref = SUB.mes ? parseD(SUB.mes + '-01') : parseD(D);
  const ano = ref.getFullYear(), mes = ref.getMonth();
  const ds = diasDoMes(ano, mes);
  const labels = ds.map((d, i) => (i % 5 === 0 || i === ds.length - 1) ? String(i + 1) : '');
  const cabec = `<div class="ch">
      <button class="btn xs" data-a="mesNav" data-v="-1">${ic('esq', 16)}</button>
      <h2 style="text-align:center">${MESL[mes]} ${ano}</h2>
      <button class="btn xs" data-a="mesNav" data-v="1">${ic('dir', 16)}</button></div>`;
  return painelPeriodo(ds, { cabec, labels, escala: 'mes' });
}

function resumoSemana() {
  const ini = semanaAtual(), ds = diasDaSemana(ini);
  const labels = ds.map(d => DOW[parseD(d).getDay()]);
  const atual = ini === segundaDe(today());
  const cabec = `<div class="ch">
      <button class="btn xs" data-a="semNav" data-v="-1">${ic('esq', 16)}</button>
      <h2 style="text-align:center">${rotuloSemana(ini)}
        <small style="display:block;font-weight:600;color:var(--tx3);font-size:10.5px">
          ${atual ? 'semana atual' : 'semana de ' + parseD(ini).getFullYear()}</small></h2>
      <button class="btn xs" data-a="semNav" data-v="1">${ic('dir', 16)}</button></div>`;
  return painelPeriodo(ds, { cabec, labels, escala: 'sem', semana: ini, atual });
}

function painelPeriodo(ds, opt) {
  const S = serieMes(ds), m = metas();
  const labels = opt.labels;
  const hoje = today();
  const passados = S.filter(s => s.d <= hoje);
  const comDado = passados.filter(s => s.temDado);

  const kcalDias = passados.filter(s => s.kcal > 0).map(s => s.kcal);
  const mediaKcal = kcalDias.length ? kcalDias.reduce((a, b) => a + b, 0) / kcalDias.length : 0;
  const treinos = passados.filter(s => s.treino).length;
  const faltas = passados.filter(s => s.falta).length;
  const semReg = passados.filter(s => !s.treino && !s.falta && !s.temDado).length;
  const motivos = {};
  passados.filter(s => s.falta && s.motivo).forEach(s =>
    s.motivo.split(' · ').forEach(m => motivos[m] = (motivos[m] || 0) + 1));
  const topMotivos = Object.entries(motivos).sort((a, b) => b[1] - a[1]);
  const volTot = passados.reduce((a, s) => a + s.vol, 0);
  const aguaDias = passados.filter(s => s.agua > 0).map(s => s.agua);
  const mediaAgua = aguaDias.length ? aguaDias.reduce((a, b) => a + b, 0) / aguaDias.length : 0;
  const habPrev = passados.reduce((a, s) => a + s.habPrev, 0);
  const habFeito = passados.reduce((a, s) => a + s.habFeito, 0);
  const escapes = passados.reduce((a, s) => a + s.escape, 0);
  const medPrev = passados.reduce((a, s) => a + s.medPrev, 0);
  const medTom = passados.reduce((a, s) => a + s.medTom, 0);
  const pesos = S.map((s, i) => s.peso ? { i, v: s.peso } : null).filter(Boolean);

  const tKcal = tendencia(kcalDias, DB.perfil.objetivo === 'perder');
  const tVol = tendencia(passados.map(s => s.vol));
  const tPeso = tendencia(pesos.map(p => p.v), DB.perfil.objetivo === 'perder', 0.4);
  const tAgua = tendencia(passados.map(s => s.agua));
  const tHab = tendencia(passados.map(s => s.habPrev ? s.habFeito / s.habPrev * 100 : null));
  const tMed = tendencia(passados.map(s => s.medPrev ? s.medTom / s.medPrev * 100 : null));
  const tSono = tendencia(passados.map(s => s.sonoH || null));

  const linha = (nome, val, t) => `<div class="row"><div class="g"><div class="t">${nome}</div><div class="s">${val}</div></div>
    <div class="v trend ${t.cls}">${t.txt}</div></div>`;

  /* ---------- números extras do painel ---------- */
  const per = opt.escala === 'sem' ? 'na semana' : 'no mês';
  const perDo = opt.escala === 'sem' ? 'da semana' : 'do mês';

  const kcalTot = passados.reduce((a, s) => a + s.kcal, 0);
  const gastoTot = passados.filter(s => s.temDado).reduce((a, s) => a + s.gasto, 0);
  const balTot = kcalTot - gastoTot;
  const kgEst = balTot / 7700;                       // ~7700 kcal por kg de gordura

  const naMeta = passados.filter(s => s.kcal > 0 && Math.abs(s.kcal - m.kcal) <= m.kcal * .1).length;
  const aguaOk = passados.filter(s => s.agua >= s.metaAgua && s.metaAgua > 0).length;
  const habOk = passados.filter(s => s.habPrev && s.habFeito >= s.habPrev).length;
  const medOk = passados.filter(s => s.medPrev && s.medTom >= s.medPrev).length;
  const diasComHab = passados.filter(s => s.habPrev).length;
  const diasComMed = passados.filter(s => s.medPrev).length;

  const noites = passados.filter(x => x.sono);
  const sonoMedia = noites.length ? noites.reduce((a, x) => a + x.sonoH, 0) / noites.length : 0;
  const sonoQmed = (() => { const q = noites.filter(x => x.sonoQ); return q.length ? q.reduce((a, x) => a + x.sonoQ, 0) / q.length : 0; })();
  const sonoDespTot = noites.reduce((a, x) => a + x.sonoDesp, 0);
  const noitesOk = noites.filter(x => x.sonoH >= metaSono() - .5).length;
  const seqReg = sequencia(d => !!DB.dias[d] && !diaVazio(DB.dias[d]));
  const seqHab = sequencia(d => {
    const hs = DB.habitos.filter(h => habDevidoEm(h, d));
    return hs.length > 0 && hs.every(h => ((DB.dias[d] || { habitos: {} }).habitos[h.id] || {}).feito);
  });
  /* "sem furar treino" só conta dias registrados: sem registro a sequência quebra,
     senão o passado vazio viraria uma sequência infinita de dias perfeitos */
  const seqTre = sequencia(d => {
    const x = DB.dias[d]; if (!x || diaVazio(x)) return false;
    const e = estadoTreino(d);
    return e === 'feito' || (e !== 'falta' && !fichaDoDia(d));
  });

  /* média de kcal por refeição */
  const refMedia = {};
  REFS.forEach(r => {
    const dd = comDado.filter(s => s.refs[r[0]] > 0);
    refMedia[r[0]] = dd.length ? dd.reduce((a, s) => a + s.refs[r[0]], 0) / dd.length : 0;
  });
  const refTotal = REFS.reduce((a, r) => a + passados.reduce((b, s) => b + s.refs[r[0]], 0), 0);

  /* esportes somados por nome */
  const espTot = {};
  passados.forEach(s => {
    const x = DB.dias[s.d]; if (!x) return;
    (x.esportes || []).forEach(e => {
      const k = e.nome || 'Atividade';
      espTot[k] = espTot[k] || { min: 0, kcal: 0, n: 0 };
      espTot[k].min += +e.min || 0; espTot[k].kcal += +e.kcal || 0; espTot[k].n++;
    });
  });
  const espLista = Object.entries(espTot).sort((a, b) => b[1].min - a[1].min);
  const espMinTot = espLista.reduce((a, e) => a + e[1].min, 0);

  /* melhor e pior dia por "pontos do dia" */
  const pontos = s => {
    let p = 0, n = 0;
    if (s.treino) p += 1; if (s.falta) p += 0;
    n++;                                              // treino sempre conta
    if (s.kcal > 0) { p += Math.max(0, 1 - Math.abs(s.kcal - m.kcal) / m.kcal); n++; }
    if (s.metaAgua) { p += Math.min(1, s.agua / s.metaAgua); n++; }
    if (s.habPrev) { p += s.habFeito / s.habPrev; n++; }
    if (s.medPrev) { p += s.medTom / s.medPrev; n++; }
    return n ? p / n * 100 : 0;
  };
  const comNota = comDado.map(s => ({ d: s.d, v: pontos(s) })).sort((a, b) => b.v - a.v);
  const melhor = comNota[0], pior = comNota.length > 1 ? comNota[comNota.length - 1] : null;
  const notaMedia = comNota.length ? comNota.reduce((a, s) => a + s.v, 0) / comNota.length : 0;

  /* desempenho por dia da semana (só faz sentido no mês) */
  const porDow = DOW.map((nome, i) => {
    const dd = passados.filter(s => parseD(s.d).getDay() === i);
    const tre = dd.filter(s => s.treino).length;
    const kc = dd.filter(s => s.kcal > 0);
    return {
      nome, n: dd.length, tre,
      kcal: kc.length ? kc.reduce((a, s) => a + s.kcal, 0) / kc.length : 0
    };
  });

  return `<div class="card">
    ${opt.cabec}
    <div class="kpi" style="margin-bottom:9px">
      <div><b style="color:var(--tre)">${treinos}</b><span>treinos</span></div>
      <div><b style="color:var(--die)">${n0(mediaKcal)}</b><span>kcal/dia</span></div>
      <div><b style="color:var(--agua)">${n1(mediaAgua / 1000)}</b><span>água L</span></div>
      <div><b style="color:var(--hab)">${habPrev ? n0(habFeito / habPrev * 100) : 0}%</b><span>hábitos</span></div>
    </div>
    <div class="mt" style="margin-top:4px"><span>Nota média ${perDo}</span><span>${n0(notaMedia)}/100</span></div>
    ${bar(notaMedia, 100, notaMedia >= 70 ? 'var(--ac)' : notaMedia >= 40 ? 'var(--warn)' : 'var(--bad)')}
    <p class="mini" style="margin-top:9px">${comDado.length} de ${passados.length} dias com registro · volume total ${n0(volTot)} kg · escapes ${n0(escapes)} kcal</p>
    ${melhor ? `<div class="row" style="margin-top:6px"><div class="g">
        <div class="t">Melhor dia: ${esc(dLabel(melhor.d))}</div>
        <div class="s">${pior ? 'mais fraco: ' + esc(dLabel(pior.d)) + ' (' + n0(pior.v) + '/100)' : 'único dia avaliado'}</div></div>
      <div class="v">${n0(melhor.v)}/100</div></div>` : ''}
  </div>

  <div class="card">
    <div class="ch"><span class="dot" style="background:var(--ac)"></span><h2>Consistência</h2>
      <span class="sub">dias que bateram a meta</span></div>
    ${[['Calorias na faixa da meta', naMeta, passados.filter(s => s.kcal > 0).length, 'var(--die)'],
       ['Água completa', aguaOk, passados.length, 'var(--agua)'],
       ['Todos os hábitos do dia', habOk, diasComHab, 'var(--hab)'],
       ['Todas as doses do dia', medOk, diasComMed, 'var(--lem)'],
       ['Noites com o sono que você quer', noitesOk, noites.length, 'var(--res)']]
      .filter(r => r[2] > 0).map(r => `<div style="margin-bottom:9px">
        <div class="mt"><span>${r[0]}</span><span>${r[1]}/${r[2]} dias</span></div>
        ${bar(r[1], r[2], r[3])}</div>`).join('') || '<p class="mini">Ainda sem dados suficientes.</p>'}
    <div class="kpi" style="margin-top:6px">
      <div><b style="color:var(--ac)">${seqReg}</b><span>dias com registro</span></div>
      <div><b style="color:var(--tre)">${seqTre}</b><span>sem furar treino</span></div>
      <div><b style="color:var(--hab)">${seqHab}</b><span>hábitos em dia</span></div>
    </div>
    <p class="mini" style="margin-top:7px">Sequências = dias seguidos, contados de hoje para trás
    em todo o histórico (não só ${per}). Um dia sem registro quebra a sequência.</p>
  </div>

  <div class="card">
    <div class="ch"><span class="dot" style="background:var(--die)"></span><h2>Balanço do período</h2>
      <span class="pill ${balTot < 0 ? 'ok' : balTot > 0 ? 'esc' : 'mut'}">${balTot > 0 ? '+' : ''}${n0(balTot)} kcal</span></div>
    <div class="kpi">
      <div><b style="color:var(--die)">${n0(kcalTot)}</b><span>kcal consumidas</span></div>
      <div><b style="color:var(--tre)">${n0(gastoTot)}</b><span>kcal gastas</span></div>
      <div><b style="color:${balTot < 0 ? 'var(--ac)' : 'var(--warn)'}">${kgEst > 0 ? '+' : ''}${n1(kgEst)}</b><span>kg estimados</span></div>
    </div>
    <p class="mini" style="margin-top:9px">Soma apenas os ${comDado.length} dia(s) com registro.
    A estimativa usa 7700 kcal por quilo de gordura — é uma referência, não uma promessa:
    ${balTot < 0 ? 'no ritmo atual você caminha para perder peso.'
      : balTot > 0 ? 'no ritmo atual você caminha para ganhar peso.' : 'você está no equilíbrio.'}
    ${pesos.length > 1 ? ` Na balança, a variação registrada ${per} foi de ${n1(pesos[pesos.length - 1].v - pesos[0].v)} kg.` : ''}</p>
  </div>

  <div class="card">

/* =========================================================
   EXPORTAR PLANILHA
   Gera um CSV com uma linha por dia. CSV abre no Excel, no
   Google Sheets e no Numbers sem nada instalado.
   Separador ";" e vírgula decimal, que é como o Excel em
   português espera; BOM no começo para os acentos saírem certos.
   ========================================================= */
const csvNum = v => (v == null || v === '' ? '' : String(v).replace('.', ','));
const csvTxt = v => {
  const t = String(v == null ? '' : v);
  return /[;"\n]/.test(t) ? '"' + t.replace(/"/g, '""') + '"' : t;
};

function planilhaDias(ds) {
  const m = metas();
  const cab = ['Data', 'Dia da semana', 'Treino', 'Exercícios feitos', 'Volume (kg)', 'Duração (min)',
    'Faltou', 'Motivo da falta',
    'Atividades', 'Kcal atividades', 'Kcal consumidas', 'Meta kcal', 'Carboidrato (g)', 'Proteína (g)',
    'Gordura (g)', 'Escapes (kcal)', 'Água (ml)', 'Meta água (ml)', 'Gasto estimado (kcal)',
    'Balanço (kcal)', 'Peso (kg)', 'Hábitos feitos', 'Hábitos previstos',
    'Doses tomadas', 'Doses previstas', 'Medicamentos tomados',
    'Dormiu às', 'Acordou às', 'Horas de sono', 'Qualidade do sono', 'Despertares', 'Sono - observação',
    'Anotação'];
  const linhas = [cab.join(';')];
  ds.forEach(d => {
    const x = DB.dias[d]; if (!x || diaVazio(x)) return;
    const t = somaDia(d), g = gastoDia(d);
    const habs = DB.habitos.filter(h => habDevidoEm(h, d));
    const hf = habs.filter(h => (x.habitos[h.id] || {}).feito).length;
    const tr = treinoDoDia(d), fa = faltaDoDia(d);
    const sn = x.sono;
    const ms = medStats(d), tomList = [];
    let tomAvulsas = 0;
    Object.keys(x.meds || {}).forEach(id => {
      const mm = medById(id), r = x.meds[id] || {};
      if (!mm || !(r.tomados || []).length) return;
      tomList.push(mm.nome + ' ' + (r.tomados || []).join(','));
      if (!medDevidoEm(mm, d)) tomAvulsas += r.tomados.length;
    });
    linhas.push([
      d, DOW[parseD(d).getDay()],
      csvTxt(tr ? tr.nome + (tr.feito ? '' : ' (em aberto)') : fa ? 'Falta' : ''),
      tr ? tr.itens.filter(i => i.feito).length + '/' + tr.itens.length : '',
      csvNum(volDia(d) || ''), tr ? tr.duracao || '' : '',
      fa ? 'sim' : '', csvTxt(fa ? (fa.obs || fa.motivo) : ''),
      csvTxt((x.esportes || []).map(e => e.nome + ' ' + e.min + 'min').join(' | ')),
      (x.esportes || []).reduce((a, e) => a + e.kcal, 0) || '',
      Math.round(t.kcal) || '', Math.round(m.kcal),
      csvNum(+t.c.toFixed(1)), csvNum(+t.p.toFixed(1)), csvNum(+t.g.toFixed(1)),
      Math.round(t.escape || 0) || '', x.agua || '', metaAguaDia(d),
      Math.round(g.total), Math.round(t.kcal - g.total),
      csvNum(x.peso || ''), habs.length ? hf : '', habs.length || '',
      ms.prev || tomList.length ? ms.tom + tomAvulsas : '', ms.prev || '',
      csvTxt(tomList.join(' | ')),
      sn ? sn.deitou : '', sn ? sn.acordou : '', sn ? csvNum(+(sonoMin(sn) / 60).toFixed(2)) : '',
      sn && sn.qual ? sn.qual : '', sn ? (sn.despertares || 0) : '', csvTxt(sn ? sn.nota || '' : ''),
      csvTxt(x.nota || '')
    ].join(';'));
  });
  return linhas.join('\r\n');
}

function periodoDias(tipo) {
  if (tipo === 'sem') return diasDaSemana(semanaAtual());
  if (tipo === 'mes') {
    const ref = SUB.mes ? parseD(SUB.mes + '-01') : parseD(D);
    return diasDoMes(ref.getFullYear(), ref.getMonth());
  }
  if (tipo === '30') { const o = []; for (let i = 29; i >= 0; i--) o.push(addDays(today(), -i)); return o; }
  return Object.keys(DB.dias).sort();
}

ACT.planilha = () => {
  SUB.expTipo = SUB.expTipo || (SUB.res === 'sem' ? 'sem' : 'mes');
  sheetPlanilha();
};
function sheetPlanilha() {
  const tipo = SUB.expTipo;
  const ds = periodoDias(tipo).filter(d => DB.dias[d] && !diaVazio(DB.dias[d]));
  const ref = SUB.mes ? parseD(SUB.mes + '-01') : parseD(D);
  sheet(`<h3>Exportar planilha</h3>
    <p class="hint">Um arquivo com uma linha por dia: treino, calorias, macros, água, peso e
    hábitos. Abre no Excel, no Google Sheets e no Numbers.</p>
    <div class="f"><label>Período</label>
      <div class="segs">
        ${[['sem', 'Semana'], ['mes', MESL[ref.getMonth()].slice(0, 3) + '/' + String(ref.getFullYear()).slice(2)],
          ['30', '30 dias'], ['tudo', 'Tudo']].map(o =>
          `<button class="${tipo === o[0] ? 'on' : ''}" data-a="expTipo" data-t="${o[0]}">${o[1]}</button>`).join('')}
      </div></div>
    <div class="${ds.length ? 'okbox' : 'warnbox'}">${ds.length
      ? `<b>${ds.length}</b> dia(s) com registro entram na planilha.`
      : 'Nenhum dia com registro neste período.'}</div>
    ${ds.length ? `<div class="btnrow">
        <button class="btn pri" data-a="planilhaEnviar">Compartilhar</button>
        <button class="btn" data-a="planilhaBaixar">Baixar</button>
      </div>
      <p class="mini" style="margin-top:10px"><b>Compartilhar</b> abre a lista de aplicativos do
      celular — escolha o e-mail e a planilha vai já anexada. No computador, use
      <b>Baixar</b> e anexe o arquivo você mesmo: e-mail não deixa um site anexar arquivo sozinho.</p>`
      : '<button class="btn full" data-a="fechar">Fechar</button>'}`);
}
ACT.expTipo = e => { SUB.expTipo = e.dataset.t; sheetPlanilha(); };

function arquivoPlanilha() {
  const ds = periodoDias(SUB.expTipo);
  const nome = 'vitta-' + (SUB.expTipo === 'tudo' ? 'historico' :
    SUB.expTipo === '30' ? 'ultimos-30-dias' :
    SUB.expTipo === 'sem' ? 'semana-' + semanaAtual() : (SUB.mes || today().slice(0, 7))) + '.csv';
  return { nome, texto: '\ufeff' + planilhaDias(ds) };
}
ACT.planilhaBaixar = () => {
  const { nome, texto } = arquivoPlanilha();
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([texto], { type: 'text/csv;charset=utf-8' }));
  a.download = nome; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  fechar(); toast('Planilha gerada ✓');
};
ACT.planilhaEnviar = async () => {
  const { nome, texto } = arquivoPlanilha();
  try {
    const arq = new File([texto], nome, { type: 'text/csv' });
    if (navigator.canShare && navigator.canShare({ files: [arq] })) {
      await navigator.share({ files: [arq], title: 'Vitta — acompanhamento', text: 'Segue minha planilha do Vitta.' });
      fechar(); return;
    }
  } catch (e) { if (e && e.name === 'AbortError') return; }
  ACT.planilhaBaixar();
  toast('Este navegador não compartilha arquivos — a planilha foi baixada');
};
/* =========================================================
   HOJE — painel de lançamento rápido
   ========================================================= */
function saudacao() {
  const h = new Date().getHours();
  return h < 12 ? 'Bom dia' : h < 18 ? 'Boa tarde' : 'Boa noite';
}
SCREENS.hoje = () => {
  const x = dia(D), m = metas(), t = somaDia(D);
  const nome = DB.perfil.nome ? ', ' + DB.perfil.nome.split(' ')[0] : '';

  const pend = habs.filter(h => !(x.habitos[h.id] || {}).feito);
  const sug = fichaDoDia(D);

  let h = `<div class="card hero">

    <p class="mini">${esc(dLabel(D))} — ${D === today() ? 'lance seus dados do dia em poucos toques.' : 'você está editando um dia anterior.'}</p>
  </div>` + dateStrip();

  /* sono — a noite que acabou de terminar abre o dia */
  h += cardSono();

  /* treino */

  h += `<div class="card">
    <div class="ch"><span class="dot" style="background:${falta ? 'var(--bad)' : 'var(--tre)'}"></span><h2>Exercícios</h2>

    ${falta ? `<div class="row" style="border:0;padding:0" data-a="ir" data-v="treino">
        <div class="g"><div class="t wrap">${esc(falta.motivo)}</div>
          <div class="s">você marcou que não ia treinar hoje</div></div>
        <div class="v">${ic('dir', 16, 'op')}</div></div>`
      : tr ? `<div class="row" style="border:0;padding:0" data-a="ir" data-v="treino">
        <div class="g"><div class="t">${esc(tr.nome)}</div>
          <div class="s">${tr.itens.filter(i => i.feito).length} de ${tr.itens.length} exercícios · ${n0(volDia(D))} kg</div></div>
        <div class="v">${ic('dir',16,'op')}</div></div>
      ${bar(tr.itens.filter(i => i.feito).length, Math.max(tr.itens.length, 1), 'var(--tre)')}`
      : `<div class="row" style="border:0;padding:0 0 10px"><div class="g">
          <div class="t">${sug ? 'Hoje na agenda: ' + esc(sug.nome) : 'Nenhum treino registrado'}</div>
          <div class="s">${sug ? (sug.exercicios || []).length + ' exercícios' : 'escolha uma ficha ou registre livre'}</div></div></div>
        <div class="btnrow">
          <button class="btn pri sm" data-a="escolherFicha">Iniciar treino</button>
          <button class="btn gh sm" data-a="marcarFalta">Não vou treinar</button>
        </div>`}
    ${(x.esportes || []).length ? `<div class="mini" style="margin-top:9px">Atividades: ${x.esportes.map(e => esc(e.nome) + ' ' + e.min + 'min').join(' · ')}</div>` : ''}
  </div>`;

  /* dieta */
  h += `<div class="card">
    <div class="ch"><span class="dot" style="background:var(--die)"></span><h2>Dieta</h2>
      <span class="sub">${n0(t.kcal)} / ${n0(m.kcal)} kcal</span></div>
    <div style="display:flex;gap:13px;align-items:center">
      ${ring(t.kcal / m.kcal, rest < -m.kcal * .05 ? 'var(--warn)' : 'var(--die)', 66, n0(Math.abs(rest)))}
      <div style="flex:1">
        <div class="mini" style="margin-bottom:7px">${rest >= 0 ? 'kcal restantes hoje' : 'kcal acima da meta'}</div>
        <div class="macro" style="margin:0;flex-direction:column;gap:7px">
          ${[['C', t.c, m.c, 'var(--carb)'], ['P', t.p, m.p, 'var(--prot)'], ['G', t.g, m.g, 'var(--gord)']].map(r =>
      `<div><div class="mt"><span>${r[0]}</span><span>${n0(r[1])}/${n0(r[2])}g</span></div>${bar(r[1], r[2], r[3])}</div>`).join('')}
        </div>
      </div>
    </div>
    <div class="btnrow" style="margin-top:12px">
      <button class="btn sm pri" data-a="fabDieta">${ic('mais',15)} Lançar refeição</button>
      <button class="btn sm" data-a="ir" data-v="dieta">Ver dieta</button>
    </div>
  </div>`;

  /* água */
  h += `<div class="card">
    <div class="ch"><span class="dot" style="background:var(--agua)"></span><h2>Água</h2>
      <span class="sub">${n1((x.agua || 0) / 1000)} / ${n1(mAgua / 1000)} L</span></div>
    ${bar(x.agua || 0, mAgua, 'var(--agua)')}
    <div class="btnrow" style="margin-top:11px">
      ${[200, 300, 500].map(v => `<button class="btn sm" data-a="agua" data-v="${v}">+${v}</button>`).join('')}
      <button class="btn sm gh" data-a="aguaCustom">…</button>
    </div>
  </div>`;

  /* lembretes do dia */
  const lems = (DB.lembretes || []).filter(l => lemDevidoEm(l, D))
    .sort((a, b) => minutos(a.hora) - minutos(b.hora));
  const lemPend = lems.filter(l => !lemFeito(l, D));
  if (lems.length) {
    h += `<div class="card">
      <div class="ch"><span class="dot" style="background:var(--lem)"></span><h2>Lembretes</h2>
        <span class="sub">${lems.length - lemPend.length}/${lems.length}</span></div>
      ${lems.map(l => linhaLem(l, D, true)).join('')}
    </div>`;
  }

  /* medicamentos do dia */
  const meds = medsDoDia(D), medSN = medsSN(D), mst = medStats(D);
  if (meds.length || medSN.length) {
    const pares = [];
    meds.forEach(mm => dosesDe(mm).forEach(hh => pares.push([mm, hh])));
    pares.sort((a, b) => (a[1] || '').localeCompare(b[1] || ''));
    h += `<div class="card">
      <div class="ch"><span class="dot" style="background:var(--lem)"></span><h2>Medicamentos</h2>
        <span class="sub">${mst.prev ? mst.tom + '/' + mst.prev + ' doses' : 'se precisar'}</span></div>
      ${mst.prev ? bar(mst.tom, mst.prev, 'var(--lem)') : ''}
      ${pares.slice(0, 5).map(([mm, hh]) => {
        const feito = medTomado(D, mm.id, hh);
        return `<div class="row">
          <button class="tick ${feito ? 'on' : ''}" data-a="medTick" data-m="${mm.id}" data-h="${hh}">${ic('check')}</button>
          <div class="g" data-a="ir" data-v="remedios"><div class="t wrap">${esc(mm.nome)}</div>
            <div class="s">${esc(medRotulo(mm))}${hh === '—' ? '' : ' · ' + hh}</div></div>
        </div>`;
      }).join('')}
      ${pares.length > 5 || medSN.length ? `<button class="btn gh full sm" style="margin-top:9px"
        data-a="ir" data-v="remedios">Ver todos${pares.length > 5 ? ` (+${pares.length - 5})` : ''}</button>` : ''}
    </div>`;
  }

  /* hábitos */
  h += `<div class="card">
    <div class="ch"><span class="dot" style="background:var(--hab)"></span><h2>Hábitos</h2>
      <span class="sub">${habs.length - pend.length}/${habs.length}</span></div>
    ${habs.length ? habs.map(hh => {
        const r = x.habitos[hh.id];
        return `<div class="row">
        <button class="tick ${r && r.feito ? 'on' : ''}" data-a="hTick" data-h="${hh.id}">${ic('check')}</button>
        <div class="g" data-a="hCheckin" data-h="${hh.id}"><div class="t">${icOu(hh.icone, 15)} ${esc(hh.nome)}</div>
          <div class="s">${r ? (r.feito ? (r.qual ? estrelas(r.qual) + ' · ' : '') + 'feito hoje' : 'não fiz hoje') : 'aguardando check-in'}</div></div>
      </div>`;
      }).join('') : `<div class="empty" style="padding:14px"><b>${ic('faisca')}</b>Nenhum hábito ativo.</div>
        <button class="btn pri full sm" data-a="ir" data-v="habitos">Criar hábito</button>`}
  </div>

  <div class="card">
    <div class="ch"><span class="dot" style="background:var(--ac)"></span><h2>Resumo e evolução</h2>
      <span class="sub">dia, semana e mês</span></div>
    <p class="mini" style="margin:-2px 0 11px">Gráficos de treino, calorias, água, hábitos e medicamentos —
    e a planilha para exportar.</p>
    <button class="btn pri full" data-a="ir" data-v="resumo">${ic('resumo', 16)} Abrir resumo</button>
  </div>

  <div class="card tight" style="margin-bottom:14px">
    <div class="row" data-a="ir" data-v="perfil"><div class="g"><div class="t">${ic('medidas',15)} Minhas medidas e metas</div>
      <div class="s">TMB ${n0(tmb())} · gasto ${n0(get())} kcal</div></div><div class="v">${ic('dir',16,'op')}</div></div>
    <div class="row" data-a="irMeds"><div class="g"><div class="t">${ic('remedio',15)} Meus medicamentos</div>
      <div class="s">${(DB.medicamentos || []).filter(mm => mm.ativo !== false).length} em uso</div></div>
      <div class="v">${ic('dir',16,'op')}</div></div>
  </div>`;
  return h;
};
/* =========================================================
   SUPABASE — conta e sincronização

   IDENTIDADE
   Cada linha do banco tem um dono (user_id) e o RLS só devolve
   as linhas de quem está pedindo. Por isso a conta precisa ser
   A MESMA em todos os aparelhos: entrar com e-mail resolve.
   A sessão anônima cria um usuário novo por aparelho — serve
   para uso em um aparelho só, nunca para sincronizar.

   CONFLITOS
   Last-write-wins por registro, comparando o campo "upd".
   Registros sem "upd" (dia aberto mas nunca lançado, perfil
   nunca editado) NUNCA são enviados: eram eles que apagavam
   os dados bons do servidor.
   ========================================================= */
const SB = { client: null, user: null, email: null, anon: false, status: 'desconectado' };
function syncBadge() {
  const e = document.getElementById('sb_status'); if (e) e.textContent = SB.status;
}
const logado = () => !!(SB.client && SB.user);

async function iniciarSupabase(manual) {
  const { url, key } = DB.cfg;
  if (!url || !key) { SB.status = 'não configurado'; syncBadge(); return; }
  if (!window.supabase) { SB.status = 'sem conexão'; syncBadge(); return; }
  try {
    SB.status = 'conectando…'; syncBadge();
    if (!SB.client) {
      SB.client = window.supabase.createClient(url, key, {
        auth: {
          persistSession: true, autoRefreshToken: true, detectSessionInUrl: true,
          // implicit: o link do e-mail funciona mesmo aberto pelo navegador
          // interno do app de e-mail, que não compartilha dados com o Chrome/Safari
          flowType: 'implicit', storageKey: 'vitta_auth'
        }
      });
      SB.client.auth.onAuthStateChange((evento, sessao) => {
        if (evento === 'SIGNED_IN' && sessao) {
          limparURL(); aplicarSessao(sessao); fechar(); syncAll(true);
        }
        if (evento === 'SIGNED_OUT') {
          SB.user = SB.email = null; SB.anon = false; SB.status = 'sem conta';
          DB.cfg.temConta = false; save(false); syncBadge();
        }
      });
    }
    const { data: { session } } = await SB.client.auth.getSession();
    if (!session) { SB.user = null; SB.status = 'sem conta'; syncBadge(); render(); return; }
    limparURL(); aplicarSessao(session);
    await syncAll(manual);
  } catch (e) {
    SB.status = 'erro: ' + (e.message || e); syncBadge();
    if (manual) toast('Falha ao conectar. Confira URL/chave.');
    console.error('[supabase]', e);
  }
}
/* tira os tokens do endereço depois que o link do e-mail é usado */
function limparURL() {
  if (location.hash && /access_token|error_description/.test(location.hash)) {
    try { history.replaceState(null, '', location.pathname + location.search); } catch (e) { }
  }
}
function aplicarSessao(session) {
  SB.user = session.user.id;
  SB.email = session.user.email || null;
  SB.anon = !!session.user.is_anonymous || !session.user.email;
  SB.status = 'conectado'; syncBadge();
  /* conta de verdade: guarda a marca para as boas-vindas não voltarem */
  const tinha = DB.cfg.temConta;
  DB.cfg.temConta = !SB.anon;
  if (DB.cfg.temConta !== tinha) save(false);
  if (DB.cfg.temConta && VIEW === 'boasVindas') go('hoje');
}

/* ---------- entrar com e-mail ----------
   Dois caminhos, e o app aceita os dois:
   1. tocar no link que chega no e-mail (funciona sem configurar nada);
   2. digitar o código de 6 dígitos (só aparece se o modelo de e-mail do
      Supabase tiver a variável do token — o que exige SMTP próprio nos
      projetos gratuitos novos).                                          */
const URL_APP = () => location.origin + location.pathname;

ACT.entrarEmail = () => {
  sheet(`<h3>Sincronizar entre aparelhos</h3>
    <p class="hint">Informe seu e-mail e abra a mensagem <b>neste mesmo aparelho</b>: tocar no
    link já entra. Use o mesmo e-mail no celular e no computador e os dados passam a ser os mesmos.</p>
    <div class="f"><label>E-mail</label>
      <input class="in" id="au_mail" type="email" inputmode="email" autocapitalize="off"
        spellcheck="false" placeholder="voce@exemplo.com" value="${esc(DB.cfg.ultimoEmail || '')}"></div>
    <div class="warnbox">Use o <b>mesmo e-mail da sua conta do Supabase</b>. Sem um servidor de
    e-mail próprio configurado, o Supabase só entrega mensagem para os endereços da organização
    do projeto — para qualquer outro, o e-mail simplesmente não chega.</div>
    ${SB.anon ? '<div class="okbox">Tudo o que já está neste aparelho sobe para a conta assim que você entrar.</div>' : ''}
    <div class="btnrow"><button class="btn" data-a="fechar">Cancelar</button>
      <button class="btn pri" data-a="enviarCodigo">Enviar acesso</button></div>`);
};
ACT.enviarCodigo = async e => {
  const email = valOf('au_mail').trim().toLowerCase();
  if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return toast('E-mail inválido');
  if (!SB.client) await iniciarSupabase(false);
  e.textContent = 'Enviando…';
  const { error } = await SB.client.auth.signInWithOtp({
    email, options: { shouldCreateUser: true, emailRedirectTo: URL_APP() }
  });
  if (error) { e.textContent = 'Enviar acesso'; return toast('Erro: ' + error.message); }
  DB.cfg.ultimoEmail = email; save(false);
  sheetCodigo(email);
};
function sheetCodigo(email) {
  const local = location.protocol === 'file:';
  sheet(`<h3>Verifique seu e-mail</h3>
    <p class="hint">Enviamos para <b>${esc(email)}</b>. Chega em alguns segundos — confira o spam.</p>
    <div class="okbox"><b>Caminho mais simples:</b> abra o e-mail neste aparelho e toque no link
    (<i>Log In</i> / <i>Confirm your mail</i>). Você volta para cá já conectado.</div>
    ${local ? '<div class="warnbox">Este arquivo está aberto direto do disco. O link do e-mail só consegue devolver você para o app se ele estiver publicado num endereço da internet — use o código abaixo, ou abra o app pelo endereço publicado.</div>' : ''}
    <div class="f"><label>Ou, se o e-mail trouxer um código de 6 dígitos</label>
      <input class="in" id="au_cod" inputmode="numeric" autocomplete="one-time-code"
        placeholder="000000" style="font-size:22px;letter-spacing:6px;text-align:center"></div>
    <div class="btnrow"><button class="btn" data-a="entrarEmail">Voltar</button>
      <button class="btn pri" data-a="confirmarCodigo" data-m="${esc(email)}">Entrar com o código</button></div>
    <p class="mini" style="margin-top:10px">Não chegou? Espere 60 segundos antes de pedir de novo —
    é o limite do Supabase. E confirme que o endereço é o mesmo da sua conta do Supabase.</p>`);
}
ACT.confirmarCodigo = async e => {
  const token = valOf('au_cod').replace(/\D/g, ''), email = e.dataset.m;
  if (token.length < 6) return toast('O código tem 6 dígitos — ou use o link do e-mail');
  e.textContent = 'Entrando…';
  // e-mail novo chega pelo modelo "Confirm signup" (type signup);
  // e-mail que já existe chega pelo "Magic Link" (type email). Tenta os dois.
  let sessao = null, ultimo = null;
  for (const tipo of ['email', 'signup', 'magiclink']) {
    const r = await SB.client.auth.verifyOtp({ email, token, type: tipo });
    if (!r.error && r.data && r.data.session) { sessao = r.data.session; break; }
    ultimo = r.error;
  }
  if (!sessao) {
    e.textContent = 'Entrar com o código';
    console.error('[auth]', ultimo);
    return toast('Código inválido ou expirado');
  }
  aplicarSessao(sessao);
  fechar(); toast('Conectado como ' + email);
  await syncAll(true);
};

/* ---------- usar só neste aparelho ---------- */
ACT.entrarAnon = () => confirmar(
  'Sem e-mail, os dados ficam só neste aparelho: cada aparelho vira um usuário diferente e eles não se enxergam. Continuar?',
  async () => {
    if (!SB.client) await iniciarSupabase(false);
    const { data, error } = await SB.client.auth.signInAnonymously();
    if (error) return toast('Erro: ' + error.message);
    aplicarSessao(data.session); await syncAll(true);
  });

ACT.sair = () => confirmar(
  'Sair da conta neste aparelho? Os lançamentos continuam guardados aqui e voltam a subir quando você entrar de novo.',
  async () => {
    await SB.client.auth.signOut();
    SB.user = SB.email = null; SB.anon = false;
    SB.status = 'sem conta'; syncBadge();
    DB.cfg.temConta = false; DB.cfg.pularBoasVindas = false; save(false);
    go('boasVindas');
  });

/* =========================================================
   mapeamento local <-> tabela
   ========================================================= */
const TABELAS = [
  {
    n: 'fichas', get: () => DB.fichas, set: a => DB.fichas = a,

    down: r => ({ id: r.id, nome: r.nome, porcao: +r.porcao, un: r.un, kcal: +r.kcal, c: +r.c, p: +r.p, g: +r.g, liq: +r.liq || 0, upd: r.upd })

    down: r => ({ id: r.id, nome: r.nome, refeicao: r.refeicao, itens: r.itens || [], variacaoDe: r.variacao_de, upd: r.upd })
  },
  {
    n: 'lembretes', get: () => DB.lembretes, set: a => DB.lembretes = a,
    up: l => ({

      repetir: l.repetir, dias: l.dias || [], ativo: l.ativo !== false, feito: l.feito || {},
      criado: l.criado || null, upd: l.upd
    }),

      meta: h.meta || 0, hora: h.hora || null, ativo: h.ativo !== false, encerrado: h.encerrado, upd: h.upd
    }),

      meta: +r.meta || 0, hora: r.hora || '', ativo: r.ativo, encerrado: r.encerrado, upd: r.upd
    })

];

async function syncAll(avisar) {
  if (!logado()) { if (avisar) toast('Entre com seu e-mail primeiro'); return; }
  SB.status = 'sincronizando…'; syncBadge();
  try {
    await aplicarExclusoes();
    for (const t of TABELAS) await syncTabela(t);
    await syncPerfil();
    await syncDias();
    DB.cfg.ultimoSync = nowISO(); DIRTY = false;
    save(false);
    SB.status = SEM_TABELA.size
      ? 'sincronizado (falta a tabela ' + [...SEM_TABELA].join(', ') + ' — rode o schema.sql)'
      : 'sincronizado';
    syncBadge();
    if (avisar) toast('Sincronizado ✓');
    render();
  } catch (e) {
    console.error('[sync]', e);
    SB.status = explicarErro(e); syncBadge();
    if (avisar) toast(SB.status);
    render();
  }
}

/* Traduz os erros que o Supabase devolve para o que fazer a respeito. */
function explicarErro(e) {
  const m = String((e && e.message) || e || '');
  if (/no unique or exclusion constraint/i.test(m))
    return 'Banco na versão antiga — rode o schema.sql de novo no SQL Editor';
  if (/USING expression/i.test(m))
    return 'Identificador em conflito entre contas — rode o schema.sql de novo (parte 8)';
  if (/row-level security/i.test(m))
    return 'Regras de segurança faltando — rode o schema.sql de novo (parte 9)';
  if (/does not exist|schema cache/i.test(m))
    return 'Falta tabela ou coluna — rode o schema.sql inteiro no SQL Editor';
  if (/Failed to fetch|NetworkError/i.test(m))
    return 'Sem conexão com o servidor';
  return 'Erro no sync: ' + m.slice(0, 80);
}

/* exclusões feitas offline ou em outro momento */
async function aplicarExclusoes() {
  const fila = DB.delFila || []; if (!fila.length) return;
  const porTabela = {};
  fila.forEach(d => (porTabela[d.t] = porTabela[d.t] || []).push(d.id));
  for (const t of Object.keys(porTabela)) {
    const { error } = await SB.client.from(t).delete().eq('user_id', SB.user).in('id', porTabela[t]);
    if (error && !tabelaAusente(error)) throw error;
  }
  DB.delFila = [];
}

/* Tabela que ainda não existe no banco (schema desatualizado) não derruba o
   sync inteiro: o app avisa uma vez e segue sincronizando o resto.            */
const SEM_TABELA = new Set();
const tabelaAusente = e => /does not exist|schema cache|PGRST205/i.test(String((e && e.message) || e));

async function syncTabela(t) {
  if (SEM_TABELA.has(t.n)) return;
  const locais = t.get();
  const { data, error } = await SB.client.from(t.n).select('*').eq('user_id', SB.user);
  if (error && tabelaAusente(error)) {
    SEM_TABELA.add(t.n);
    console.warn('[sync] tabela ausente:', t.n, '— rode o schema.sql de novo');
    return;
  }
  if (error) throw error;
  const remotos = (data || []).map(t.down);
  const mapL = new Map(locais.map(x => [x.id, x])), mapR = new Map(remotos.map(x => [x.id, x]));
  const enviar = [], resultado = [];
  new Set([...mapL.keys(), ...mapR.keys()]).forEach(id => {
    const l = mapL.get(id), r = mapR.get(id);
    if (l && r) { const vence = (l.upd || '') >= (r.upd || '') ? l : r; resultado.push(vence); if (vence === l) enviar.push(l); }
    else if (l) { resultado.push(l); enviar.push(l); }
    else resultado.push(r);
  });
  t.set(resultado);
  if (enviar.length) await upsertCompat(t.n, enviar.map(t.up));
}

/* Bancos criados com a versão antiga do schema.sql ainda têm a chave
   primária só no id. Tenta a chave nova e cai para a antiga se preciso. */
async function upsertCompat(tabela, linhas) {
  let r = await SB.client.from(tabela).upsert(linhas, { onConflict: 'user_id,id' });
  if (r.error && /no unique or exclusion constraint/i.test(r.error.message || '')) {
    r = await SB.client.from(tabela).upsert(linhas, { onConflict: 'id' });
  }
  if (r.error && tabelaAusente(r.error)) { SEM_TABELA.add(tabela); return; }
  if (r.error) throw r.error;
}

async function syncPerfil() {
  const { data, error } = await SB.client.from('perfil').select('*').eq('user_id', SB.user).maybeSingle();
  if (error) throw error;
  const meu = DB.perfil.upd;                     // null = nunca editei neste aparelho
  if (data && (!meu || (data.upd || '') > meu)) {
    DB.perfil = Object.assign(DB.perfil, data.dados, { upd: data.upd });
    return;
  }
  if (!meu) return;                              // nada meu para enviar: não sobrescreve o servidor
  const { error: e2 } = await SB.client.from('perfil')
    .upsert({ user_id: SB.user, dados: DB.perfil, upd: meu }, { onConflict: 'user_id' });
  if (e2) throw e2;
}

const baixaDia = r => ({
  treino: r.treino, esportes: r.esportes || [], refeicoes: r.refeicoes || {}, agua: r.agua || 0,
  habitos: r.habitos || {}, meds: r.meds || {}, sono: r.sono || null, peso: r.peso, nota: r.nota || '',
  ajusteKcal: +r.ajuste_kcal || 0, ajusteAgua: +r.ajuste_agua || 0, upd: r.upd
});
const diaEnviavel = x => !!(x && x.upd && !diaVazio(x));

async function syncDias() {
  const limite = addDays(today(), -400);
  const { data, error } = await SB.client.from('dias').select('*').eq('user_id', SB.user).gte('data', limite);
  if (error) throw error;
  const mapR = new Map((data || []).map(r => [r.data, r]));
  const enviar = [];
  new Set([...Object.keys(DB.dias), ...mapR.keys()]).forEach(k => {
    const l = DB.dias[k], r = mapR.get(k);
    if (l && r) {
      // só disputo o dia se eu tiver conteúdo de verdade e for mais recente
      if (diaEnviavel(l) && l.upd >= r.upd) enviar.push(k);
      else DB.dias[k] = baixaDia(r);
    } else if (l) { if (diaEnviavel(l)) enviar.push(k); }
    else DB.dias[k] = baixaDia(r);
  });
  if (!enviar.length) return;
  const rows = enviar.map(k => {
    const x = DB.dias[k];
    return {
      user_id: SB.user, data: k, treino: x.treino, esportes: x.esportes || [], refeicoes: x.refeicoes || {},
      agua: x.agua || 0, habitos: x.habitos || {}, meds: x.meds || {}, sono: x.sono || null,
      peso: x.peso, nota: x.nota || '',
      ajuste_kcal: x.ajusteKcal || 0, ajuste_agua: x.ajusteAgua || 0, upd: x.upd
    };
  });
  for (let i = 0; i < rows.length; i += 200) {
    let lote = rows.slice(i, i + 200);
    let { error: e2 } = await SB.client.from('dias').upsert(lote, { onConflict: 'user_id,data' });
    /* banco ainda sem as colunas novas: reenvio sem elas em vez de perder o dia inteiro */
    for (const col of ['meds', 'sono']) {
      if (!e2) break;
      const msg = e2.message || '';
      if (!(new RegExp(col, 'i').test(msg) && /column|schema cache/i.test(msg))) continue;
      lote = lote.map(r => { const c = Object.assign({}, r); delete c[col]; return c; });
      ({ error: e2 } = await SB.client.from('dias').upsert(lote, { onConflict: 'user_id,data' }));
      if (!e2) console.warn('[sync] coluna dias.' + col + ' ausente — rode a parte 10 do schema.sql');
    }
    if (e2) throw e2;
  }
}

let SYNC_T;
function agendarSync() {
  if (!DB.cfg.autoSync || !logado()) return;
  clearTimeout(SYNC_T); SYNC_T = setTimeout(() => syncAll(false), 4000);
}
ACT.syncAgora = () => { logado() ? syncAll(true) : iniciarSupabase(true); };
window.addEventListener('online', () => { if (DIRTY) agendarSync(); });
/* ========================= INIT ========================= */
window.addEventListener('error', e => console.error('[vitta]', e.message));
document.addEventListener('visibilitychange', () => {
  if (!document.hidden) {
    if (D !== today() && !SUB._back) { D = today(); render(); }
    if (DIRTY) agendarSync();
    checarLembretes();
  }
});
/* logo como ícone da aba e da tela de início */
(() => {
  const uri = logoDataURI();
  document.querySelectorAll("link[rel='icon'],link[rel='apple-touch-icon']").forEach(l => l.href = uri);
})();

aplicarTema();
if (window.matchMedia) {
  // no modo automático, acompanha o aparelho mudando de tema em tempo real
  matchMedia('(prefers-color-scheme: dark)')
    .addEventListener('change', () => { if ((DB.cfg.tema || 'auto') === 'auto') aplicarTema(); });
}

if (precisaBoasVindas()) VIEW = 'boasVindas';
render();
iniciarSupabase(false);

/* Notificações: registra o service worker (quem mostra o aviso) e
   confere o que venceu — ao abrir, ao voltar ao app e a cada 30s. */
registrarSW().then(() => checarLembretes());
setInterval(checarLembretes, 30000);
