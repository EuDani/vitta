TITULOS.lembretes = ['Lembretes', 'o que não pode escapar'];

function lemInicio(l) { return l.data || l.criado || today(); }
function lemDevidoEm(l, d) {
  if (l.ativo === false) return false;
  if (l.repetir === 'uma') return (l.data || l.criado) === d;
  if (d < lemInicio(l)) return false;
  if (l.fim && d > l.fim) return false;
  return repeteEm({ tipo: l.repetir, dias: l.dias, diaMes: l.diaMes, mesAno: l.mesAno,
    cada: l.cada, inicio: lemInicio(l) }, d);
}
const lemFeito = (l, d) => !!(l.feito || {})[d];
const minutos = h => { const [a, b] = String(h || '00:00').split(':').map(Number); return a * 60 + b; };
function lemAtrasado(l, d) {
  if (d !== today() || lemFeito(l, d)) return false;
  const agora = new Date();
  return agora.getHours() * 60 + agora.getMinutes() > minutos(l.hora);
}

/* =========================================================
   AVISOS NO SISTEMA
   Quem exibe a notificação é o service worker (sw.js), e não a
   página: é assim que o aviso aparece no Android com o app em
   segundo plano, e é a ÚNICA forma no iPhone. Se o worker não
   estiver disponível, cai para a notificação da página e, em
   último caso, para o aviso interno do app.
   ========================================================= */
let SW_REG = null;
async function registrarSW() {
  if (!('serviceWorker' in navigator) || location.protocol === 'file:') return null;
  try {
    SW_REG = await navigator.serviceWorker.register('sw.js');
    await navigator.serviceWorker.ready;
    return SW_REG;
  } catch (e) { console.warn('[sw] não registrado:', e.message); return null; }
}
const podeNotificar = () => typeof Notification !== 'undefined';
const permNotif = () => podeNotificar() ? Notification.permission : 'indisponível';
const swAtivo = () => !!(SW_REG && (SW_REG.active || SW_REG.installing || SW_REG.waiting));

ACT.pedirNotif = async () => {
  if (!podeNotificar()) return toast('Este navegador não suporta notificações');
  try {
    const r = await Notification.requestPermission();
    if (r === 'granted') { await registrarSW(); toast('Notificações ativadas'); }
    else toast('Permissão negada');
  } catch (e) { toast('Não foi possível pedir a permissão'); }
  render();
};
ACT.testarNotif = async () => {
  const ok = await avisar('Vitta', 'Se você está lendo isto, as notificações funcionam.', 'teste');
  if (!ok) toast('Ainda sem permissão do sistema');
};

/* Dentro do APK Android não existe a API Notification do navegador; quem
   avisa é o próprio Android, pela ponte. É também o único caminho que faz
   o aviso chegar com o app fechado. */
const NO_ANDROID = () => typeof AndroidVitta !== 'undefined' && !!AndroidVitta.notificar;

async function avisar(titulo, corpo, tag) {
  if (NO_ANDROID()) {
    try { AndroidVitta.notificar(String(titulo), String(corpo), String(tag || 'vitta')); return true; }
    catch (e) { console.warn('[aviso android]', e); }
  }
  if (permNotif() === 'granted') {
    try {
      const reg = SW_REG || (navigator.serviceWorker ? await navigator.serviceWorker.ready.catch(() => null) : null);
      if (reg && reg.active) {
        reg.active.postMessage({ tipo: 'aviso', titulo, corpo, tag, icone: logoDataURI() });
        return true;
      }
      if (reg && reg.showNotification) {
        await reg.showNotification(titulo, { body: corpo, tag, icon: logoDataURI(), badge: logoDataURI() });
        return true;
      }
      new Notification(titulo, { body: corpo, tag, icon: logoDataURI() });
      return true;
    } catch (e) { console.warn('[aviso]', e); }
  }
  toast(corpo);
  return false;
}

/* Percorre lembretes E hábitos com horário, e avisa o que já venceu
   e ainda não foi marcado. Roda ao abrir o app, ao voltar para ele e
   a cada 30 segundos enquanto estiver aberto.                        */
function checarLembretes() {
  const d = today(), agora = new Date(), mn = agora.getHours() * 60 + agora.getMinutes();
  let mudou = false;

  (DB.lembretes || []).forEach(l => {
    if (!lemDevidoEm(l, d) || lemFeito(l, d)) return;
    if (mn < minutos(l.hora)) return;
    const marca = d + 'T' + l.hora;
    if (l.alertado === marca) return;
    l.alertado = marca; mudou = true;
    avisar('Lembrete', l.texto, 'lem-' + l.id);
  });

  (DB.habitos || []).forEach(h => {
    if (h.ativo === false) return;
    const horas = horasHab(h);
    if (!horas.length || !habDevidoEm(h, d)) return;
    /* cada horário tem o seu próprio check: o aviso é do horário que
       venceu e ainda está em branco, não do hábito inteiro. Avisa só o
       último vencido — senão o app aberto ao meio-dia dispara a manhã toda. */
    const venceu = horas.filter(hh => mn >= minutos(hh) && !slotFeito(d, h, hh)).sort();
    if (!venceu.length) return;
    const hora = venceu[venceu.length - 1], marca = d + 'T' + hora;
    if (h.alertado === marca) return;
    h.alertado = marca; mudou = true;
    avisar('Hábito de hoje', h.nome + (umaVezSo(h) ? ' — ainda falta o check de hoje.'
      : ` — falta o check das ${hora}.`), 'hab-' + h.id);
  });

  (DB.medicamentos || []).forEach(m => {
    if (!medDevidoEm(m, d)) return;
    /* avisa a primeira dose vencida que ainda não foi marcada */
    const pend = dosesDe(m).filter(hh => hh !== '—' && mn >= minutos(hh) && !medTomado(d, m.id, hh)).sort();
    if (!pend.length) return;
    const hora = pend[pend.length - 1], marca = d + 'T' + hora;
    if (m.alertado === marca) return;
    m.alertado = marca; mudou = true;
    avisar('Hora do medicamento', m.nome + ' — ' + medRotulo(m) + (m.obs ? ' (' + m.obs + ')' : ''), 'med-' + m.id);
  });

  if (mudou) { save(false); if (['lembretes', 'hoje', 'habitos', 'remedios'].includes(VIEW)) render(); }
}

/* =========================================================
   AGENDA ENTREGUE AO ANDROID
   O app web só consegue avisar enquanto está aberto (ou com o service
   worker vivo, o que o sistema não garante). No APK, o Android marca
   alarmes de verdade — mas para isso precisa saber O QUE avisar e A QUE
   HORAS. Esta função monta essa lista e entrega.

   Só entra o que se repete com hora marcada. Item de uma vez só já é
   tratado pela própria tela quando o app abre.
   ========================================================= */
function agendaParaAndroid() {
  const itens = [];
  const diasDe = cfg => cfg.tipo === 'dias' ? (cfg.dias || []) : null;

  (DB.lembretes || []).filter(l => l.ativo !== false && l.repetir !== 'uma').forEach(l => {
    itens.push({ id: 'lem-' + l.id, hora: l.hora, titulo: 'Lembrete', corpo: l.texto,
      dias: diasDe({ tipo: l.repetir, dias: l.dias }) });
  });
  (DB.habitos || []).filter(h => h.ativo !== false).forEach(h => {
    horasHab(h).forEach(hora => itens.push({
      id: 'hab-' + h.id + '-' + hora, hora, titulo: 'Hábito de hoje',
      corpo: h.nome + (horasHab(h).length > 1 ? ` — check das ${hora}.` : ' — ainda falta o check de hoje.'),
      dias: diasDe({ tipo: h.freqTipo, dias: h.dias })
    }));
  });
  (DB.medicamentos || []).filter(m => m.ativo !== false && m.freq !== 'necessario').forEach(m => {
    (m.horarios || []).forEach(hora => itens.push({
      id: 'med-' + m.id + '-' + hora, hora, titulo: 'Hora do medicamento',
      corpo: m.nome + ' — ' + medRotulo(m) + (m.obs ? ' (' + m.obs + ')' : ''),
      dias: diasDe({ tipo: m.freq, dias: m.dias })
    }));
  });
  return itens.filter(i => /^\d{2}:\d{2}$/.test(i.hora || ''));
}
let AGENDA_ENVIADA = '';
function mandarAgenda() {
  if (typeof AndroidVitta === 'undefined' || !AndroidVitta.agendarAvisos) return;
  const json = JSON.stringify(agendaParaAndroid());
  if (json === AGENDA_ENVIADA) return;          // nada mudou: não mexe nos alarmes
  AGENDA_ENVIADA = json;
  try { AndroidVitta.agendarAvisos(json); } catch (e) { console.warn('[agenda]', e); }
}

    ativo: true, upd: nowISO()
  };
  if (SUB.lemEdit) Object.assign(DB.lembretes.find(x => x.id === SUB.lemEdit), o);
  else DB.lembretes.push(Object.assign({ id: uid(), criado: today(), feito: {}, alertado: '' }, o));
  SUB.lemTmp = null; save(); fechar(); render();
  if (permNotif() === 'default') ACT.pedirNotif();
};
ACT.delLembrete = e => confirmar('Excluir este lembrete?', () => {

/* ---------- tela ---------- */
function linhaLem(l, d, compacto) {

}

  h += doDia.length ? `<div class="card">

  if (prox.length) {

        <div class="g"><div class="t wrap">${esc(l.texto)}</div>
          <div class="s">${l.ativo === false ? 'pausado'

        <div class="v">${ic('dir',16,'op')}</div></div>`).join('')}</div>`;
  }
  return h + `<button class="btn pri full" data-a="novoLembrete" style="margin-bottom:14px">${ic('mais',15)} Novo lembrete</button>`;

/* =========================================================
   MÓDULO 5 — MEDICAMENTOS
   Remédio, vitamina, suplemento: tudo que se toma em dose e
   horário. Três formas de repetir:
     diario     — todo dia
     dias       — dias fixos da semana
     necessario — sem rotina, você registra quando toma
   Com data de fim, some sozinho quando o tratamento acaba.
   ========================================================= */
TITULOS.medicamentos = ['Meus medicamentos', 'o que você toma e quando'];

const UNIDADES = ['comprimido(s)', 'cápsula(s)', 'gota(s)', 'ml', 'mg', 'g', 'sachê(s)',
  'colher(es)', 'scoop(s)', 'aplicação(ões)', 'unidade(s)'];
const TIPOS_MED = [['remedio', 'Remédio'], ['vitamina', 'Vitamina'],
  ['suplemento', 'Suplemento'], ['outro', 'Outro']];

const medById = id => (DB.medicamentos || []).find(m => m.id === id);

function medDevidoEm(m, d) {
  if (m.ativo === false) return false;
  if (m.inicio && d < m.inicio) return false;
  if (m.fim && d > m.fim) return false;
  if (m.freq === 'necessario') return false;          // aparece na seção própria
  if (m.freq === 'dias') return (m.dias || []).includes(parseD(d).getDay());
  return true;
}
/* horários previstos; sem horário marcado, uma dose solta no dia */
const dosesDe = m => (m.horarios && m.horarios.length) ? m.horarios : ['—'];
/* leitura pura: não cria o dia, para não sujar o histórico ao gerar relatório */
const medsDe = d => (DB.dias[d] || {}).meds || {};
const medTomado = (d, id, hora) => ((medsDe(d)[id] || {}).tomados || []).includes(hora);
function medsDoDia(d) { return (DB.medicamentos || []).filter(m => medDevidoEm(m, d)); }
function medsSN(d) {
  return (DB.medicamentos || []).filter(m => m.ativo !== false && m.freq === 'necessario'
    && (!m.inicio || d >= m.inicio) && (!m.fim || d <= m.fim));
}
function medStats(d) {
  let prev = 0, tom = 0;
  medsDoDia(d).forEach(m => dosesDe(m).forEach(h => { prev++; if (medTomado(d, m.id, h)) tom++; }));
  return { prev, tom };
}
const medRotulo = m => `${m.dose ? n1(m.dose) + ' ' : ''}${m.unidade || ''}`.trim();
/* o "para que serve": aparece embaixo do nome em todas as listas */
const medMotivo = m => m.motivo
  ? `<div class="s" style="display:flex;gap:5px;align-items:flex-start;margin-top:2px">
      <span style="line-height:0;flex:none;padding-top:6px">${ic('meta', 11)}</span>
      <span class="wrap">${esc(m.motivo)}</span></div>` : '';
function medQuando(m) {
  const per = m.fim ? ` · até ${dLabel(m.fim)}` : '';
  if (m.freq === 'necessario') return 'se necessário' + per;
  if (m.freq === 'dias') return ((m.dias || []).slice().sort().map(i => DOW[i]).join(', ') || 'sem dias') + per;
  return 'todo dia' + per;
}

/* ---------- marcar dose ---------- */
ACT.medTick = e => {
  const id = e.dataset.m, hora = e.dataset.h, x = dia(D);
  const r = x.meds[id] = x.meds[id] || { tomados: [] };
  const i = r.tomados.indexOf(hora);
  i < 0 ? r.tomados.push(hora) : r.tomados.splice(i, 1);
  if (!r.tomados.length) delete x.meds[id];
  tocaDia(D); save(); render();
};
/* dose avulsa: registra a hora do relógio */
ACT.medAvulso = e => {
  const m = medById(e.dataset.m), x = dia(D);
  const agora = new Date();
  const hora = pad(agora.getHours()) + ':' + pad(agora.getMinutes());
  const r = x.meds[m.id] = x.meds[m.id] || { tomados: [] };
  r.tomados.push(hora);
  tocaDia(D); save(); render(); toast(`${m.nome} registrado às ${hora}`);
};
ACT.medDesfazAvulso = e => {
  const x = dia(D), r = x.meds[e.dataset.m];
  if (!r) return;
  r.tomados.splice(+e.dataset.i, 1);
  if (!r.tomados.length) delete x.meds[e.dataset.m];
  tocaDia(D); save(); render();
};

/* ---------- cadastro ---------- */
FAB.remedios = 'novoMed';
ACT.novoMed = e => {

  SUB.medId = id;
  const m = id ? medById(id) : null;
  SUB.medFreq = m ? m.freq : 'diario';
  SUB.medDias = m ? (m.dias || []).slice() : [1, 2, 3, 4, 5];

};

    <div class="f"><label>Nome</label>

      ${TIPOS_MED.map(t => `<button class="chip ${SUB.medTipo === t[0] ? 'on' : ''}"

    </div></div>

    <div class="grid2">

          `<option ${m.unidade === u ? 'selected' : ''}>${u}</option>`).join('')}</select></div>
    </div>

    <div class="f"><label>Com que frequência</label>
      <div class="segs">${[['diario', 'Todo dia'], ['dias', 'Dias fixos'], ['necessario', 'Se precisar']].map(t =>
        `<button class="${SUB.medFreq === t[0] ? 'on' : ''}" data-a="medFreq" data-t="${t[0]}">${t[1]}</button>`).join('')}</div></div>

    ${SUB.medFreq === 'dias' ? `<div class="f"><div class="chiprow">
      ${DOW.map((d, i) => `<button class="chip ${SUB.medDias.includes(i) ? 'on' : ''}"
        data-a="medDia" data-d="${i}">${d}</button>`).join('')}</div></div>` : ''}

    ${SUB.medFreq !== 'necessario' ? `<div class="f"><label>Horários do dia</label>
      ${SUB.medHoras.map((h, i) => `<div class="row" style="gap:8px;border:0;padding:5px 0">
        <input class="in" type="time" value="${esc(h)}" id="md_h${i}" style="flex:1">
        ${SUB.medHoras.length > 1 ? `<button class="btn xs danger" data-a="medDelHora" data-i="${i}" data-sujo="1">${ic('x', 13)}</button>` : ''}
      </div>`).join('')}
      <button class="btn gh full sm" style="margin-top:6px" data-a="medAddHora" data-sujo="1">${ic('mais', 14)} Outro horário</button>
      <p class="mini" style="margin-top:6px">Com horário preenchido você recebe uma notificação na hora
      (se tiver autorizado em Configurações).</p></div>` : ''}

    <div class="grid2">
      <div class="f"><label>Começa em</label>
        <input class="in" id="md_ini" type="date" value="${esc(m.inicio || today())}"></div>
      <div class="f"><label>Termina em (opcional)</label>

    </div>
    <p class="mini" style="margin:-4px 0 12px">Tratamento com prazo — antibiótico, por exemplo — some
    sozinho da lista quando a data de fim passa.</p>

    <div class="f"><label>Para que serve</label>
      <textarea class="in" id="md_motivo" placeholder="ex: repor a vitamina D que veio baixa no exame — ossos e imunidade">${esc(m.motivo || '')}</textarea>
      <p class="mini" style="margin-top:5px">O objetivo que este medicamento vai ajudar. Fica visível
      toda vez que você abre o item — nos dias de desânimo é o que faz continuar.</p></div>

    <div class="f"><label>Observação</label>

    ${SUB.medId ? `<button class="btn danger full sm" style="margin-top:9px" data-a="delMed" data-m="${SUB.medId}">Excluir</button>` : ''}`);
}
function medCapturar() {
  SUB.medTmp = SUB.medTmp || {};
  ['md_nome', 'md_dose', 'md_un', 'md_ini', 'md_fim', 'md_obs', 'md_motivo'].forEach(k => {

  SUB.medHoras = SUB.medHoras.map((h, i) => {
    const e = document.getElementById('md_h' + i); return e ? e.value : h;

function medRestaurar() {

  Object.keys(SUB.medTmp).forEach(k => { const e = document.getElementById(k); if (e) e.value = SUB.medTmp[k]; });

const medRedesenha = () => { sheetMed(SUB.medId ? medById(SUB.medId) : null); medRestaurar(); };
ACT.medTipo = e => { medCapturar(); SUB.medTipo = e.dataset.t; medRedesenha(); };
ACT.medFreq = e => { medCapturar(); SUB.medFreq = e.dataset.t; medRedesenha(); };

};
/* =========================================================
   SONO — o registro da noite, dentro da tela Hoje

   Guardo no dia: hora de deitar, hora de acordar, qualidade
   (1 a 5), quantas vezes acordou no meio da noite e uma
   observação livre.

   A noite atravessa a meia-noite quase sempre. Por isso a
   duração NÃO é uma subtração simples: se acordar <= deitar,
   somo 24 horas. Dormir 23:30 → 07:00 dá 7h30, não -16h30.

   Convenção: a noite pertence ao dia em que a pessoa ACORDOU.
   É como todo mundo fala ("hoje eu dormi mal"), e é o que faz
   o registro caber no dia que está aberto na tela.
   ========================================================= */
const SONO_PADRAO = { deitou: '23:00', acordou: '07:00', qual: 0, despertares: 0, nota: '' };

const sonoDe = d => (DB.dias[d] || {}).sono || null;
function sonoMin(s) {
  if (!s || !s.deitou || !s.acordou) return 0;
  let m = minutos(s.acordou) - minutos(s.deitou);
  if (m <= 0) m += 1440;                       // atravessou a meia-noite
  return m;
}
const sonoHoras = s => sonoMin(s) / 60;
const hhmm = min => Math.floor(min / 60) + 'h' + (min % 60 ? pad(min % 60) : '');
/* meta de sono: o que a pessoa definir no perfil, senão 8 horas */
const metaSono = () => num(DB.perfil.metaSono) || 8;

/* uma nota de 0 a 100 para a noite: duração perto da meta, qualidade
   declarada e quantas vezes acordou. Serve para o gráfico do resumo. */
function sonoNota(s) {
  if (!s) return 0;
  const h = sonoHoras(s), meta = metaSono();
  const dur = h ? Math.max(0, 1 - Math.abs(h - meta) / meta) : 0;
  const q = s.qual ? s.qual / 5 : dur;                       // sem nota, uso a duração
  const acordadas = Math.max(0, 1 - (+s.despertares || 0) * .15);
  return (dur * .45 + q * .40 + acordadas * .15) * 100;
}
/* Verde quando a noite foi boa, âmbar no meio, vermelho quando foi ruim:
   o número sozinho não diz se 62% é bom ou péssimo. */
const corSono = nota => nota >= 75 ? 'var(--ac)' : nota >= 50 ? 'var(--res)' : nota >= 30 ? 'var(--warn)' : 'var(--bad)';

function sonoResumo(s) {
  if (!s) return 'não registrado';
  const p = [];
  if (sonoMin(s)) p.push(hhmm(sonoMin(s)));
  if (s.deitou && s.acordou) p.push(s.deitou + ' → ' + s.acordou);
  if (+s.despertares) p.push(s.despertares + '× acordou');
  return p.join(' · ') || 'registrado';
}

/* ---------- folha de registro ---------- */
ACT.registrarSono = () => {
  const s = sonoDe(D) || SONO_PADRAO;
  SUB.sonoQual = s.qual || 0;
  SUB.sonoDesp = +s.despertares || 0;
  sheetSono(s);
};
function sheetSono(s) {
  const min = sonoMin(s);
  sheet(`<h3>${ic('sono', 18)} Sono da noite</h3>
    <p class="hint">${esc(dLabel(D))} — a noite que terminou nesta manhã. Se você deitou ontem
    às 23h e acordou hoje às 7h, é aqui que ela entra.</p>

    <div class="grid2">
      <div class="f"><label>Fui dormir</label>
        <input class="in" id="sn_de" type="time" value="${esc(s.deitou || '23:00')}" data-inp="sonoPrev"></div>
      <div class="f"><label>Acordei</label>
        <input class="in" id="sn_ac" type="time" value="${esc(s.acordou || '07:00')}" data-inp="sonoPrev"></div>
    </div>
    <div class="okbox" id="sn_dur" style="margin:-2px 0 13px">${textoDuracao(min)}</div>

    <div class="f"><label>Qualidade do sono</label>
      <div class="chiprow">${[1, 2, 3, 4, 5].map(q =>
        `<button class="chip ${SUB.sonoQual === q ? 'on' : ''}" data-a="sonoQual" data-q="${q}"
          style="flex:1;text-align:center">${estrelas(q, q)}</button>`).join('')}</div>
      <p class="mini" style="margin-top:5px">1 = acordei quebrado · 5 = acordei inteiro.</p></div>

        <button class="btn xs" data-a="sonoDesp" data-v="-1" data-sujo="1">${ic('menos', 14)}</button>
        <div class="g" style="text-align:center">
          <div class="t" style="font-size:19px">${SUB.sonoDesp}</div>
          <div class="s">${SUB.sonoDesp === 0 ? 'dormi direto' : SUB.sonoDesp === 1 ? 'uma vez' : SUB.sonoDesp + ' vezes'}</div>
        </div>
        <button class="btn xs" data-a="sonoDesp" data-v="1" data-sujo="1">${ic('mais', 14)}</button>
      </div></div>

    <div class="f"><label>Observação</label>

}
function textoDuracao(min) {
  if (!min) return 'Preencha os dois horários para ver quanto você dormiu.';
  const h = min / 60, meta = metaSono(), dif = h - meta;
  return `<b>${hhmm(min)} de sono.</b> ` + (Math.abs(dif) < .5
    ? 'Bem em cima da sua meta de ' + n1(meta) + ' h.'
    : dif < 0 ? `${n1(Math.abs(dif))} h a menos que a sua meta de ${n1(meta)} h.`
      : `${n1(dif)} h a mais que a sua meta de ${n1(meta)} h.`);
}
/* só o quadro da duração é redesenhado: mexer no campo não pode
   derrubar o que já foi digitado na observação */
ACT.sonoPrev = () => {
  const e = document.getElementById('sn_dur');
  if (e) e.innerHTML = textoDuracao(sonoMin({ deitou: valOf('sn_de'), acordou: valOf('sn_ac') }));
};
function sonoCapturar() {
  SUB.sonoTmp = {
    deitou: valOf('sn_de'), acordou: valOf('sn_ac'), nota: valOf('sn_nota')
  };
}
function sonoRedesenha() {

  sheetSono(Object.assign({}, sonoDe(D) || SONO_PADRAO, t, { qual: SUB.sonoQual }));
}
ACT.sonoQual = e => { sonoCapturar(); SUB.sonoQual = +e.dataset.q; sonoRedesenha(); };
ACT.sonoDesp = e => {

  SUB.sonoDesp = Math.max(0, Math.min(20, SUB.sonoDesp + (+e.dataset.v)));

ACT.salvarSono = () => {
  const deitou = valOf('sn_de'), acordou = valOf('sn_ac');

  const x = dia(D);

  };

  toast('Sono registrado — ' + hhmm(sonoMin(x.sono)));
};
ACT.apagarSono = () => confirmar('Apagar o registro de sono desta noite?', () => {
  const x = dia(D); delete x.sono;
  SUB.sonoTmp = null; tocaDia(D); save(); fechar(); render();
});

/* ---------- cartão da tela Hoje ---------- */
function cardSono() {
  const s = sonoDe(D), min = sonoMin(s), meta = metaSono() * 60;
  return `<div class="card">
    <div class="ch"><span class="dot" style="background:var(--res)"></span><h2>Sono</h2>
      <span class="sub">${s ? hhmm(min) + (s.qual ? ' · ' + estrelas(s.qual) : '') : 'sem registro'}</span></div>
    ${s ? `${bar(min, meta, 'var(--res)')}

        <div class="g">

            <span class="pill ${min >= meta * .9 ? 'ok' : 'mut'}">${n1(min / 60)} h</span></div>
          <div class="s wrap">${+s.despertares ? `acordou ${s.despertares}×` : 'dormiu direto'}${s.nota ? ' · ' + esc(s.nota) : ''}</div>

      : `<p class="mini" style="margin-bottom:10px">Quanto tempo você dormiu, como acordou e quantas

      <button class="btn pri full sm" data-a="registrarSono">${ic('lua', 15)} Registrar a noite</button>`}
  </div>`;
}
/* =========================================================
   MEU CALENDÁRIO — feriados, aniversários e datas do dia

   Duas origens, de propósito:

   1. FERIADOS NACIONAIS, calculados. São nove fixos e quatro que
      andam com a Páscoa (Carnaval, Sexta-feira Santa, Corpus
      Christi). Cadastrar isso na mão todo ano seria trabalho
      repetido e desatualiza sozinho; aqui a data sai da conta.

   2. AS SUAS DATAS, guardadas. Aniversário, feriado da sua cidade,
      "dia da terra", a data da consulta que se repete todo ano.

   Tudo o que cai no dia aparece no cartão de bom-dia da tela Hoje
   e no calendário do resumo mensal.
   ========================================================= */
TITULOS.calendario = ['Meu calendário', 'feriados, aniversários e datas'];

const TIPOS_DATA = [
  ['feriado', 'Feriado', 'calendario', 'var(--bad)'],
  ['aniversario', 'Aniversário', 'festa', 'var(--hab)'],
  ['comemorativa', 'Data comemorativa', 'faisca', 'var(--res)'],
  ['pessoal', 'Data pessoal', 'estrela', 'var(--ac)']
];
const tipoData = t => TIPOS_DATA.find(x => x[0] === t) || TIPOS_DATA[3];

/* ---------- Páscoa e os feriados que andam com ela ----------
   Algoritmo de Meeus/Butcher para o calendário gregoriano. Vale para
   qualquer ano entre 1583 e 4099 — mais do que suficiente. */
function pascoa(ano) {
  const a = ano % 19, b = Math.floor(ano / 100), c = ano % 100;
  const d = Math.floor(b / 4), e = b % 4;
  const f = Math.floor((b + 8) / 25), g = Math.floor((b - f + 1) / 3);
  const h = (19 * a + b - d - g + 15) % 30;
  const i = Math.floor(c / 4), k = c % 4;
  const l = (32 + 2 * e + 2 * i - h - k) % 7;
  const m = Math.floor((a + 11 * h + 22 * l) / 451);
  const mes = Math.floor((h + l - 7 * m + 114) / 31);
  const dia = ((h + l - 7 * m + 114) % 31) + 1;
  return dstr(new Date(ano, mes - 1, dia));
}

const FERIADOS_FIXOS = [
  [0, 1, 'Confraternização Universal'], [3, 21, 'Tiradentes'],
  [4, 1, 'Dia do Trabalho'], [8, 7, 'Independência do Brasil'],
  [9, 12, 'Nossa Senhora Aparecida'], [10, 2, 'Finados'],
  [10, 15, 'Proclamação da República'], [10, 20, 'Consciência Negra'],
  [11, 25, 'Natal']
];

/* Cache por ano: a conta é barata, mas o calendário do mês chama isto
   uma vez por célula e não faz sentido repetir 31 vezes. */
const FERIADOS_CACHE = {};
function feriadosNacionais(ano) {
  if (FERIADOS_CACHE[ano]) return FERIADOS_CACHE[ano];
  const p = pascoa(ano);
  const lista = [
    ...FERIADOS_FIXOS.map(([m, d, nome]) => ({ data: `${ano}-${pad(m + 1)}-${pad(d)}`, nome })),
    { data: addDays(p, -48), nome: 'Carnaval (segunda)' },
    { data: addDays(p, -47), nome: 'Carnaval' },
    { data: addDays(p, -46), nome: 'Quarta-feira de Cinzas' },
    { data: addDays(p, -2), nome: 'Sexta-feira Santa' },
    { data: p, nome: 'Páscoa' },
    { data: addDays(p, 60), nome: 'Corpus Christi' }
  ].map(f => ({ id: 'nac-' + f.data, nome: f.nome, tipo: 'feriado', nacional: true, data: f.data }));
  FERIADOS_CACHE[ano] = lista;
  return lista;
}

/* Sugestões que a pessoa liga se quiser — nenhuma vem ligada. */
const DATAS_SUGERIDAS = [
  [3, 6, 'Dia Mundial da Atividade Física'], [3, 7, 'Dia Mundial da Saúde'],
  [3, 22, 'Dia da Terra'], [4, 31, 'Dia Mundial sem Tabaco'],
  [5, 5, 'Dia do Meio Ambiente'], [8, 10, 'Dia Mundial da Saúde Mental'],
  [8, 29, 'Dia Mundial do Coração'], [10, 14, 'Dia Mundial do Diabetes'],
  [2, 15, 'Dia Mundial do Sono']
];

/* ---------- o que cai neste dia ---------- */
const dataAnual = o => o.anual !== false;
function dataCaiEm(o, d) {
  const p = parseD(d);
  if (!dataAnual(o)) return o.data === d;
  if ((+o.mes || 0) !== p.getMonth()) return false;
  const ultimo = new Date(p.getFullYear(), p.getMonth() + 1, 0).getDate();
  return p.getDate() === clamp(+o.dia || 1, 1, ultimo);
}
function datasDoDia(d) {
  const p = parseD(d);
  const nac = DB.cfg.feriados === false ? []
    : feriadosNacionais(p.getFullYear()).filter(f => f.data === d);
  const minhas = (DB.datas || []).filter(o => dataCaiEm(o, d));
  return [...nac, ...minhas];
}
const temFeriado = d => datasDoDia(d).some(o => o.tipo === 'feriado');

/* "Aniversário de Ana (32)" — a idade só aparece se o ano foi informado */
function rotuloData(o, d) {
  if (o.tipo === 'aniversario' && o.ano) {
    const anos = parseD(d || today()).getFullYear() - (+o.ano);
    if (anos > 0 && anos < 130) return o.nome + ' (' + anos + ')';
  }
  return o.nome;
}
const textoDatas = d => datasDoDia(d).map(o => rotuloData(o, d)).join(' · ');

/* ---------- criar e editar ---------- */

    ${SUB.dtId ? `<button class="btn danger full sm" style="margin-top:9px" data-a="delData" data-dt="${SUB.dtId}">Excluir</button>` : ''}`);
}
function dtCapturar() {

/* ---------- calendário do mês, no resumo ----------
   Uma agenda de verdade: cada dia mostra o que aconteceu (treino,
   dieta, sono, hábitos, doses) e o que a data é. Tocar num dia abre
   o resumo daquele dia — é assim que se navega numa agenda.        */
/* Duas versões da mesma agenda:
   completa  — célula grande, marcadores do que foi registrado, legenda
               e a lista das datas do mês embaixo;
   resumida  — só a grade dos números, para quem quer ver o mês inteiro
               sem rolar e ir direto ao dia.
   A escolha fica guardada (DB.cfg.calCompacto): é preferência de quem
   usa, não estado de uma visita. */
const calCompacto = () => DB.cfg.calCompacto === true;
ACT.calCompacto = () => { DB.cfg.calCompacto = !calCompacto(); save(false); render(); };

function calendarioMes(ano, mes) {
  const comp = calCompacto();
  const primeiro = new Date(ano, mes, 1);
  const dias = new Date(ano, mes + 1, 0).getDate();
  const vazios = primeiro.getDay();                    // domingo = 0
  const hoje = today();

  let cels = '';
  for (let i = 0; i < vazios; i++) cels += '<div class="cal-v"></div>';
  for (let d = 1; d <= dias; d++) {
    const data = `${ano}-${pad(mes + 1)}-${pad(d)}`;
    const x = DB.dias[data], futuro = data > hoje;
    const dts = datasDoDia(data);
    const fer = dts.some(o => o.tipo === 'feriado');
    const pontos = [];
    if (!futuro && x) {
      if (estadoTreino(data) === 'feito') pontos.push('var(--tre)');
      else if (estadoTreino(data) === 'falta') pontos.push('var(--bad)');
      if (somaDia(data).kcal > 0) pontos.push('var(--die)');
      if (sonoDe(data)) pontos.push('var(--res)');
      const hs = DB.habitos.filter(h => habDevidoEm(h, data));
      if (hs.length && hs.every(h => (regHab(data, h.id) || {}).feito)) pontos.push('var(--hab)');
      const ms = medStats(data);
      if (ms.prev && ms.tom >= ms.prev) pontos.push('var(--lem)');
    }
    cels += `<button class="cal-d ${data === hoje ? 'hoje' : ''} ${data === D ? 'sel' : ''}
      ${futuro ? 'fut' : ''} ${fer ? 'fer' : ''} ${pontos.length ? 'com' : ''}" data-a="calDia" data-d="${data}"
      title="${esc(dLabel(data) + (dts.length ? ' — ' + dts.map(o => rotuloData(o, data)).join(', ') : ''))}">
      <b>${d}</b>
      ${comp ? '' : `<span class="cal-p">${pontos.slice(0, 5).map(c => `<i style="background:${c}"></i>`).join('')}</span>`}
      ${dts.length ? `<span class="cal-e" style="background:${tipoData(dts[0].tipo)[3]}"></span>` : ''}
    </button>`;
  }

  const doMes = [];
  for (let d = 1; d <= dias; d++) {
    const data = `${ano}-${pad(mes + 1)}-${pad(d)}`;
    datasDoDia(data).forEach(o => doMes.push({ d: data, o }));
  }

  return `<div class="card larga">
    <div class="ch"><span class="dot" style="background:var(--ac)"></span><h2>Agenda de ${MESL[mes]}</h2>
      <button class="btn xs" data-a="calCompacto"
        title="${comp ? 'Mostrar marcadores, legenda e as datas do mês' : 'Ver só a grade, sem rolar'}">
        ${comp ? ic('mais', 13) + ' Completo' : ic('menos', 13) + ' Resumir'}</button></div>
    <div class="cal-h">${['dom', 'seg', 'ter', 'qua', 'qui', 'sex', 'sáb'].map(s => `<span>${s}</span>`).join('')}</div>
    <div class="cal ${comp ? 'comp' : ''}">${cels}</div>
    ${comp ? `<p class="mini" style="margin-top:10px">${doMes.length
        ? plural(doMes.length, 'data marcada', 'datas marcadas') + ' neste mês · toque num dia para abrir'
        : 'Toque num dia para abrir o resumo dele.'}</p>`
      : `<div class="cal-leg">
      ${[['var(--tre)', 'treino'], ['var(--die)', 'dieta'], ['var(--res)', 'sono'],
         ['var(--hab)', 'hábitos'], ['var(--lem)', 'doses']].map(([c, t]) =>
        `<span><i style="background:${c}"></i>${t}</span>`).join('')}
    </div>
    ${doMes.length ? `<div class="sec-title" style="margin:16px 4px 8px">Datas do mês</div>
      ${doMes.map(({ d, o }) => `<div class="row" data-a="calDia" data-d="${d}">
        <span style="line-height:0;color:${tipoData(o.tipo)[3]};flex:none">${ic(tipoData(o.tipo)[2], 15)}</span>
        <div class="g"><div class="t wrap">${esc(rotuloData(o, d))}</div>
          <div class="s">${esc(dLabel(d))}${o.obs ? ' · ' + esc(o.obs) : ''}</div></div>
      </div>`).join('')}`
      : `<p class="mini" style="margin-top:11px">Nenhuma data marcada neste mês.
        <b data-a="irCalendario" style="color:var(--res);cursor:pointer">Ajustar meu calendário</b>.</p>`}`}
  </div>`;
}

/* =========================================================
   PESAGEM DA SEMANA

   O peso já era guardado por dia. O que faltava era o RITMO:
   pesar todo dia mostra ruído — água, sal, o que você comeu
   ontem — e não evolução. Uma vez por semana, no mesmo dia e
   nas mesmas condições, é o que deixa a curva dizer alguma
   coisa.

   Por isso este módulo não inventa um dado novo: ele organiza
   o que já existe em semanas, mostra se a desta semana já foi
   feita e leva a diferença para o relatório mensal.
   ========================================================= */

/* dia da semana em que você se pesa (0 = domingo). Padrão: segunda. */
const diaPesagem = () => {
  const v = DB.perfil.diaPesagem;
  return v == null ? 1 : clamp(Math.round(+v), 0, 6);
};

/* Todas as pesagens, da mais nova para a mais velha. */
function pesagens() {
  return Object.keys(DB.dias)
    .filter(d => num(DB.dias[d].peso) > 0)
    .sort((a, b) => b.localeCompare(a))
    .map(d => ({ d, kg: num(DB.dias[d].peso) }));
}
const ultimaPesagem = () => pesagens()[0] || null;

/* A pesagem desta semana (segunda a domingo), se já houver. */
function pesagemDaSemana(ref = today()) {
  const ini = segundaDe(ref), fim = addDays(ini, 6);
  return pesagens().find(p => p.d >= ini && p.d <= fim) || null;
}
/* Próxima data de pesagem: o seu dia da semana, desta semana ou da
   próxima se o desta já passou e você já se pesou. */
function proximaPesagem() {
  const ini = segundaDe(today());
  const alvo = addDays(ini, (diaPesagem() + 6) % 7);      // dom=0 vira o 7º dia
  if (alvo >= today()) return alvo;
  return pesagemDaSemana() ? addDays(alvo, 7) : today();
}
/* Diferença para a pesagem anterior a uma dada. */
function variacaoPeso(p) {
  if (!p) return null;
  const ant = pesagens().find(x => x.d < p.d);
  return ant ? { kg: p.kg - ant.kg, de: ant } : null;
}
/* Bom é ir na direção do objetivo — e "manter" quer dizer ficar parado. */
function corVariacao(delta) {
  if (delta == null || Math.abs(delta) < 0.2) return 'var(--tx2)';
  const obj = DB.perfil.objetivo;
  if (obj === 'perder') return delta < 0 ? 'var(--ac)' : 'var(--warn)';
  if (obj === 'ganhar') return delta > 0 ? 'var(--ac)' : 'var(--warn)';
  return 'var(--tx2)';
}
const sinal = v => (v > 0 ? '+' : '') + n1(v);

/* =========================================================
   RESUMO — relatórios diário, semanal e mensal
   O painel semanal e o mensal são o MESMO código
   (painelPeriodo): muda só a lista de dias e o cabeçalho.
   ========================================================= */
const W = 320;

function chartBar(vals, o = {}) {
  const h = o.h || 118, pad = 16, n = vals.length || 1;
  const max = Math.max(o.max || 0, o.meta || 0, ...vals.map(v => v || 0), 1);
  const bw = (W - pad * 2) / n, bar = Math.max(2, bw * .62);
  let g = '';
  vals.forEach((v, i) => {
    const hh = (v || 0) / max * (h - 24);
    const x = pad + i * bw + (bw - bar) / 2, y = h - 14 - hh;
    g += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bar.toFixed(1)}" height="${Math.max(hh, v ? 2 : 0).toFixed(1)}"
      rx="${Math.min(3, bar / 2)}" fill="${o.cor || 'var(--res)'}" opacity="${v ? .95 : .18}"/>`;
  });
  if (o.meta) {
    const y = h - 14 - o.meta / max * (h - 24);
    g += `<line x1="${pad}" x2="${W - pad}" y1="${y.toFixed(1)}" y2="${y.toFixed(1)}" stroke="var(--tx3)" stroke-width="1" stroke-dasharray="4 4"/>
      <text x="${W - pad}" y="${(y - 4).toFixed(1)}" text-anchor="end" font-size="9" fill="var(--tx3)">meta ${n0(o.meta)}</text>`;
  }
  let lab = '';
  (o.labels || []).forEach((t, i) => {
    if (!t) return;
    lab += `<text x="${(pad + i * bw + bw / 2).toFixed(1)}" y="${h - 3}" text-anchor="middle" font-size="8.5" fill="var(--tx3)">${esc(t)}</text>`;
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${h}">${g}${lab}</svg>`;
}

function chartLine(pts, o = {}) {
  // pts: [{i, v}] apenas pontos com valor
  const h = o.h || 118, pad = 18, n = o.n || pts.length || 1;
  if (pts.length < 1) return `<div class="empty">Sem dados suficientes.</div>`;
  const vs = pts.map(p => p.v);
  let mn = Math.min(...vs), mx = Math.max(...vs);
  if (mx - mn < (o.minRange || 1)) { const c = (mx + mn) / 2, r = (o.minRange || 1) / 2; mn = c - r; mx = c + r; }
  const X = i => pad + (n <= 1 ? 0 : i / (n - 1) * (W - pad * 2));
  const Y = v => h - 16 - (v - mn) / (mx - mn) * (h - 30);
  const d = pts.map((p, k) => `${k ? 'L' : 'M'}${X(p.i).toFixed(1)} ${Y(p.v).toFixed(1)}`).join(' ');
  const area = `${d} L${X(pts[pts.length - 1].i).toFixed(1)} ${h - 16} L${X(pts[0].i).toFixed(1)} ${h - 16} Z`;
  const cor = o.cor || 'var(--res)';
  return `<svg class="chart" viewBox="0 0 ${W} ${h}" >
    <defs><linearGradient id="g1" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="${cor}" stop-opacity=".28"/><stop offset="1" stop-color="${cor}" stop-opacity="0"/></linearGradient></defs>
    <path d="${area}" fill="url(#g1)"/>
    <path d="${d}" fill="none" stroke="${cor}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    ${pts.map(p => `<circle cx="${X(p.i).toFixed(1)}" cy="${Y(p.v).toFixed(1)}" r="2.6" fill="${cor}"/>`).join('')}
    <text x="2" y="12" font-size="9" fill="var(--tx3)">${n1(mx)}</text>
    <text x="2" y="${h - 18}" font-size="9" fill="var(--tx3)">${n1(mn)}</text>
  </svg>`;
}

function tendencia(vals, inverso, lim) {
  /* null = dia sem registro (não entra na conta). Zero é um valor de
     verdade: quem parou de beber água precisa ver a queda, não "estável". */
  const v = vals.filter(x => x != null);
  if (v.length < 4) return { txt: 'sem tendência', cls: 'flat', pct: 0 };
  const m = Math.floor(v.length / 2);
  const a = v.slice(0, m).reduce((x, y) => x + y, 0) / m;
  const b = v.slice(m).reduce((x, y) => x + y, 0) / (v.length - m);
  /* saiu do zero: percentual não existe (divisão por zero), mas a mudança
     é real e é a mais importante de todas — "comecei a fazer". */
  if (!a) return b ? { txt: '▲ começou', cls: inverso ? 'down' : 'up', pct: 100 }
                   : { txt: 'estável', cls: 'flat', pct: 0 };
  const pct = (b - a) / a * 100;
  const bom = inverso ? pct < 0 : pct > 0;
  if (Math.abs(pct) < (lim || 2)) return { txt: 'estável', cls: 'flat', pct };
  return { txt: `${pct > 0 ? '▲' : '▼'} ${n1(Math.abs(pct))}%`, cls: bom ? 'up' : 'down', pct };
}

/* ---------- coleta do mês ---------- */
function diasDoMes(ano, mes) {
  const n = new Date(ano, mes + 1, 0).getDate(), out = [];
  for (let i = 1; i <= n; i++) out.push(`${ano}-${pad(mes + 1)}-${pad(i)}`);
  return out;
}
function serieMes(ds) {
  const m = metas();
  return ds.map(d => {
    const x = DB.dias[d];
    const s = x ? somaDia(d) : Z();
    const habs = DB.habitos.filter(h => habDevidoEm(h, d));
    const ck = habChecks(d, habs);          // check-ins, não hábitos: 3 horários = 3 checks
    const md = medStats(d);
    return {
      d, kcal: s.kcal, c: s.c, p: s.p, g: s.g, escape: s.escape || 0,
      agua: x ? x.agua || 0 : 0, peso: x && x.peso ? num(x.peso) : null,
      treino: estadoTreino(d) === 'feito', falta: estadoTreino(d) === 'falta',
      motivo: (faltaDoDia(d) || {}).motivo || '', vol: volDia(d),
      esporte: x ? (x.esportes || []).reduce((a, e) => a + e.kcal, 0) : 0,
      habPrev: ck.prev, habFeito: ck.feitos, temDado: !!x && !diaVazio(x),
      medPrev: md.prev, medTom: md.tom,
      dur: x && x.treino && x.treino.feito ? +x.treino.duracao || 0 : 0,
      espMin: x ? (x.esportes || []).reduce((a, e) => a + (+e.min || 0), 0) : 0,
      refs: refsDoDia(d), metaAgua: metaAguaDia(d), gasto: x ? gastoDia(d).total : 0,
      sono: sonoDe(d), sonoH: sonoHoras(sonoDe(d)), sonoQ: (sonoDe(d) || {}).qual || 0,
      sonoDesp: +((sonoDe(d) || {}).despertares || 0), sonoNota: sonoDe(d) ? sonoNota(sonoDe(d)) : null
    };
  });
}
/* kcal por refeição, para o gráfico de distribuição */
function refsDoDia(d) {
  const x = DB.dias[d], o = {};
  REFS.forEach(r => o[r[0]] = 0);
  if (x) REFS.forEach(r => { o[r[0]] = somaItens(x.refeicoes[r[0]] || []).kcal; });
  return o;
}

/* ---------- semanas ---------- */
function segundaDe(d) {                 // segunda-feira da semana de d
  const p = parseD(d), dw = (p.getDay() + 6) % 7;
  return addDays(d, -dw);
}
function diasDaSemana(ini) { const o = []; for (let i = 0; i < 7; i++) o.push(addDays(ini, i)); return o; }
const semanaAtual = () => SUB.sem || segundaDe(D);
function rotuloSemana(ini) {
  const fim = addDays(ini, 6), a = parseD(ini), b = parseD(fim);
  const mesmoMes = a.getMonth() === b.getMonth();
  return `${a.getDate()} ${mesmoMes ? '' : MESL[a.getMonth()].slice(0, 3).toLowerCase() + ' '}– ${b.getDate()} ${MESL[b.getMonth()].slice(0, 3).toLowerCase()}`;
}

/* sequência de dias seguidos (até hoje) em que a condição foi verdadeira */
function sequencia(cond) {
  let n = 0, d = today();
  /* o dia de hoje ainda está em curso: se falhou hoje, olho a partir de ontem */
  if (!cond(d)) d = addDays(d, -1);
  for (let i = 0; i < 400; i++) { if (!cond(d)) break; n++; d = addDays(d, -1); }
  return n;
}

ACT.salvarPeso = e => {

function resumoMes() {
  const ref = SUB.mes ? parseD(SUB.mes + '-01') : parseD(D);
  const ano = ref.getFullYear(), mes = ref.getMonth();
  const ds = diasDoMes(ano, mes);
  const labels = ds.map((d, i) => (i % 5 === 0 || i === ds.length - 1) ? String(i + 1) : '');
  const cabec = `<div class="ch">

      <h2 style="text-align:center">${MESL[mes]} ${ano}</h2>
      <button class="btn xs" data-a="mesNav" data-v="1">${ic('dir', 16)}</button></div>`;
  return painelPeriodo(ds, { cabec, labels, escala: 'mes', antes: calendarioMes(ano, mes) });
}

function resumoSemana() {
  const ini = semanaAtual(), ds = diasDaSemana(ini);
  const labels = ds.map(d => DOW[parseD(d).getDay()]);
  const atual = ini === segundaDe(today());
  const cabec = `<div class="ch">

      <h2 style="text-align:center">${rotuloSemana(ini)}

          ${atual ? 'semana atual' : 'semana de ' + parseD(ini).getFullYear()}</small></h2>
      <button class="btn xs" data-a="semNav" data-v="1">${ic('dir', 16)}</button></div>`;
  return painelPeriodo(ds, { cabec, labels, escala: 'sem', semana: ini, atual });
}

function painelPeriodo(ds, opt) {
  const S = serieMes(ds), m = metas();
  const labels = opt.labels;
  const hoje = today();
  const passados = S.filter(s => s.d <= hoje);
  const comDado = passados.filter(s => s.temDado);

  const kcalDias = passados.filter(s => s.kcal > 0).map(s => s.kcal);
  const mediaKcal = kcalDias.length ? kcalDias.reduce((a, b) => a + b, 0) / kcalDias.length : 0;
  const treinos = passados.filter(s => s.treino).length;
  const faltas = passados.filter(s => s.falta).length;
  const semReg = passados.filter(s => !s.treino && !s.falta && !s.temDado).length;
  const motivos = {};
  passados.filter(s => s.falta && s.motivo).forEach(s =>
    s.motivo.split(' · ').forEach(m => motivos[m] = (motivos[m] || 0) + 1));
  const topMotivos = Object.entries(motivos).sort((a, b) => b[1] - a[1]);
  const volTot = passados.reduce((a, s) => a + s.vol, 0);
  const aguaDias = passados.filter(s => s.agua > 0).map(s => s.agua);
  const mediaAgua = aguaDias.length ? aguaDias.reduce((a, b) => a + b, 0) / aguaDias.length : 0;
  const habPrev = passados.reduce((a, s) => a + s.habPrev, 0);
  const habFeito = passados.reduce((a, s) => a + s.habFeito, 0);
  const escapes = passados.reduce((a, s) => a + s.escape, 0);
  const medPrev = passados.reduce((a, s) => a + s.medPrev, 0);
  const medTom = passados.reduce((a, s) => a + s.medTom, 0);
  const pesos = S.map((s, i) => s.peso ? { i, v: s.peso } : null).filter(Boolean);

  const tKcal = tendencia(kcalDias, DB.perfil.objetivo === 'perder');
  const tVol = tendencia(passados.map(s => s.vol));
  const tPeso = tendencia(pesos.map(p => p.v), DB.perfil.objetivo === 'perder', 0.4);
  const tAgua = tendencia(passados.map(s => s.agua));
  const tHab = tendencia(passados.map(s => s.habPrev ? s.habFeito / s.habPrev * 100 : null));
  const tMed = tendencia(passados.map(s => s.medPrev ? s.medTom / s.medPrev * 100 : null));
  const tSono = tendencia(passados.map(s => s.sonoH || null));

  const linha = (nome, val, t) => `<div class="row"><div class="g"><div class="t">${nome}</div><div class="s">${val}</div></div>
    <div class="v trend ${t.cls}">${t.txt}</div></div>`;

  /* ---------- números extras do painel ---------- */
  const per = opt.escala === 'sem' ? 'na semana' : 'no mês';
  const perDo = opt.escala === 'sem' ? 'da semana' : 'do mês';

  const kcalTot = passados.reduce((a, s) => a + s.kcal, 0);
  const gastoTot = passados.filter(s => s.temDado).reduce((a, s) => a + s.gasto, 0);
  const balTot = kcalTot - gastoTot;
  const kgEst = balTot / 7700;                       // ~7700 kcal por kg de gordura

  const naMeta = passados.filter(s => s.kcal > 0 && Math.abs(s.kcal - m.kcal) <= m.kcal * .1).length;
  const aguaOk = passados.filter(s => s.agua >= s.metaAgua && s.metaAgua > 0).length;
  const habOk = passados.filter(s => s.habPrev && s.habFeito >= s.habPrev).length;
  const medOk = passados.filter(s => s.medPrev && s.medTom >= s.medPrev).length;
  const diasComHab = passados.filter(s => s.habPrev).length;
  const diasComMed = passados.filter(s => s.medPrev).length;

  const noites = passados.filter(x => x.sono);
  const sonoMedia = noites.length ? noites.reduce((a, x) => a + x.sonoH, 0) / noites.length : 0;
  const sonoQmed = (() => { const q = noites.filter(x => x.sonoQ); return q.length ? q.reduce((a, x) => a + x.sonoQ, 0) / q.length : 0; })();
  const sonoDespTot = noites.reduce((a, x) => a + x.sonoDesp, 0);
  const noitesOk = noites.filter(x => x.sonoH >= metaSono() - .5).length;
  const sonoPct = noites.length ? noites.reduce((a, x) => a + (x.sonoNota || 0), 0) / noites.length : 0;
  const seqReg = sequencia(d => !!DB.dias[d] && !diaVazio(DB.dias[d]));
  const seqHab = sequencia(d => {
    const hs = DB.habitos.filter(h => habDevidoEm(h, d));
    return hs.length > 0 && hs.every(h => habCompleto(d, h));
  });
  /* "sem furar treino" só conta dias registrados: sem registro a sequência quebra,
     senão o passado vazio viraria uma sequência infinita de dias perfeitos */
  const seqTre = sequencia(d => {
    const x = DB.dias[d]; if (!x || diaVazio(x)) return false;
    const e = estadoTreino(d);
    return e === 'feito' || (e !== 'falta' && !fichaDoDia(d));
  });

  /* média de kcal por refeição */
  const refMedia = {};
  REFS.forEach(r => {
    const dd = comDado.filter(s => s.refs[r[0]] > 0);
    refMedia[r[0]] = dd.length ? dd.reduce((a, s) => a + s.refs[r[0]], 0) / dd.length : 0;
  });
  const refTotal = REFS.reduce((a, r) => a + passados.reduce((b, s) => b + s.refs[r[0]], 0), 0);

  /* esportes somados por nome */
  const espTot = {};
  passados.forEach(s => {
    const x = DB.dias[s.d]; if (!x) return;
    (x.esportes || []).forEach(e => {
      const k = e.nome || 'Atividade';
      espTot[k] = espTot[k] || { min: 0, kcal: 0, n: 0 };
      espTot[k].min += +e.min || 0; espTot[k].kcal += +e.kcal || 0; espTot[k].n++;
    });
  });
  const espLista = Object.entries(espTot).sort((a, b) => b[1].min - a[1].min);
  const espMinTot = espLista.reduce((a, e) => a + e[1].min, 0);

  /* melhor e pior dia por "pontos do dia" */
  const pontos = s => {
    let p = 0, n = 0;
    if (s.treino) p += 1; if (s.falta) p += 0;
    n++;                                              // treino sempre conta
    if (s.kcal > 0) { p += Math.max(0, 1 - Math.abs(s.kcal - m.kcal) / m.kcal); n++; }
    if (s.metaAgua) { p += Math.min(1, s.agua / s.metaAgua); n++; }
    if (s.habPrev) { p += s.habFeito / s.habPrev; n++; }
    if (s.medPrev) { p += s.medTom / s.medPrev; n++; }
    return n ? p / n * 100 : 0;
  };
  const comNota = comDado.map(s => ({ d: s.d, v: pontos(s) })).sort((a, b) => b.v - a.v);
  const melhor = comNota[0], pior = comNota.length > 1 ? comNota[comNota.length - 1] : null;
  const notaMedia = comNota.length ? comNota.reduce((a, s) => a + s.v, 0) / comNota.length : 0;

  /* desempenho por dia da semana (só faz sentido no mês) */
  const porDow = DOW.map((nome, i) => {
    const dd = passados.filter(s => parseD(s.d).getDay() === i);
    const tre = dd.filter(s => s.treino).length;
    const kc = dd.filter(s => s.kcal > 0);
    return {
      nome, n: dd.length, tre,
      kcal: kc.length ? kc.reduce((a, s) => a + s.kcal, 0) / kc.length : 0
    };
  });

  return `${opt.antes || ''}
  <div class="card larga">
    ${opt.cabec}
    <div class="kpi" style="margin-bottom:9px">
      <div><b style="color:var(--tre)">${treinos}</b><span>treinos</span></div>
      <div><b style="color:var(--die)">${n0(mediaKcal)}</b><span>kcal/dia</span></div>
      <div><b style="color:var(--agua)">${n1(mediaAgua / 1000)}</b><span>água L</span></div>
      <div><b style="color:var(--hab)">${habPrev ? n0(habFeito / habPrev * 100) : 0}%</b><span>hábitos</span></div>
    </div>
    <div style="display:flex;gap:14px;align-items:center;margin-top:6px">
      <div style="text-align:center;flex:none">
        ${ring(sonoPct / 100, corSono(sonoPct), 66, noites.length ? n0(sonoPct) + '%' : '—')}
        <div class="mini" style="margin-top:4px">Sono</div>
      </div>
      <div style="flex:1;min-width:0">
        <div class="mt"><span>Qualidade do sono</span><span>${noites.length
          ? n1(sonoMedia) + ' h · ' + plural(noites.length, 'noite', 'noites') : 'sem registro'}</span></div>
        ${bar(sonoPct, 100, corSono(sonoPct))}
        <div class="mt" style="margin-top:9px"><span>Nota média ${perDo}</span><span>${n0(notaMedia)}/100</span></div>
        ${bar(notaMedia, 100, notaMedia >= 70 ? 'var(--ac)' : notaMedia >= 40 ? 'var(--warn)' : 'var(--bad)')}
      </div>
    </div>
    <p class="mini" style="margin-top:9px">${comDado.length} de ${passados.length} dias com registro · volume total ${n0(volTot)} kg · escapes ${n0(escapes)} kcal</p>
    ${melhor ? `<div class="row" style="margin-top:6px"><div class="g">
        <div class="t">Melhor dia: ${esc(dLabel(melhor.d))}</div>
        <div class="s">${pior ? 'mais fraco: ' + esc(dLabel(pior.d)) + ' (' + n0(pior.v) + '/100)' : 'único dia avaliado'}</div></div>
      <div class="v">${n0(melhor.v)}/100</div></div>` : ''}
  </div>
  <div class="colunas tres">

  <div class="card">
    <div class="ch"><span class="dot" style="background:var(--ac)"></span><h2>Consistência</h2>
      <span class="sub">dias que bateram a meta</span></div>
    ${[['Calorias na faixa da meta', naMeta, passados.filter(s => s.kcal > 0).length, 'var(--die)'],
       ['Água completa', aguaOk, passados.length, 'var(--agua)'],
       ['Todos os hábitos do dia', habOk, diasComHab, 'var(--hab)'],
       ['Todas as doses do dia', medOk, diasComMed, 'var(--lem)'],
       ['Noites com o sono que você quer', noitesOk, noites.length, 'var(--res)']]
      .filter(r => r[2] > 0).map(r => `<div style="margin-bottom:9px">
        <div class="mt"><span>${r[0]}</span><span>${r[1]}/${r[2]} dias</span></div>
        ${bar(r[1], r[2], r[3])}</div>`).join('') || '<p class="mini">Ainda sem dados suficientes.</p>'}
    <div class="kpi" style="margin-top:6px">
      <div><b style="color:var(--ac)">${seqReg}</b><span>dias com registro</span></div>
      <div><b style="color:var(--tre)">${seqTre}</b><span>sem furar treino</span></div>
      <div><b style="color:var(--hab)">${seqHab}</b><span>hábitos em dia</span></div>
    </div>
    <p class="mini" style="margin-top:7px">Sequências = dias seguidos, contados de hoje para trás
    em todo o histórico (não só ${per}). Um dia sem registro quebra a sequência.</p>
  </div>

  <div class="card">
    <div class="ch"><span class="dot" style="background:var(--die)"></span><h2>Balanço do período</h2>
      <span class="pill ${balTot < 0 ? 'ok' : balTot > 0 ? 'esc' : 'mut'}">${balTot > 0 ? '+' : ''}${n0(balTot)} kcal</span></div>
    <div class="kpi">
      <div><b style="color:var(--die)">${n0(kcalTot)}</b><span>kcal consumidas</span></div>
      <div><b style="color:var(--tre)">${n0(gastoTot)}</b><span>kcal gastas</span></div>
      <div><b style="color:${balTot < 0 ? 'var(--ac)' : 'var(--warn)'}">${kgEst > 0 ? '+' : ''}${n1(kgEst)}</b><span>kg estimados</span></div>
    </div>
    <p class="mini" style="margin-top:9px">Soma apenas os ${comDado.length} dia(s) com registro.
    A estimativa usa 7700 kcal por quilo de gordura — é uma referência, não uma promessa:
    ${balTot < 0 ? 'no ritmo atual você caminha para perder peso.'
      : balTot > 0 ? 'no ritmo atual você caminha para ganhar peso.' : 'você está no equilíbrio.'}
    ${pesos.length > 1 ? (() => { const dl = pesos[pesos.length - 1].v - pesos[0].v;
      return ` Na balança, a variação registrada ${per} foi de ${(dl > 0 ? '+' : '') + n1(dl)} kg.`; })() : ''}</p>
  </div>

  <div class="card">
    <div class="ch"><span class="dot" style="background:var(--tre)"></span><h2>Presença nos treinos</h2>
      <span class="sub">${passados.length ? n0(treinos / passados.length * 100) : 0}% dos dias</span></div>
    <div class="kpi">
      <div><b style="color:var(--die)">${treinos}</b><span>treinou</span></div>
      <div><b style="color:var(--bad)">${faltas}</b><span>faltou</span></div>
      <div><b style="color:var(--tx3)">${semReg}</b><span>sem registro</span></div>
    </div>
    ${topMotivos.length ? `<div class="sec-title" style="margin:16px 4px 8px">Por que você faltou</div>
      ${topMotivos.map(([m, n]) => `<div class="row">
        <div class="g"><div class="t">${esc(m)}</div></div>
        <div class="v">${n}×</div></div>`).join('')}`
      : `<p class="mini" style="margin-top:10px">${faltas ? 'Faltas sem motivo anotado.'
        : 'Nenhuma falta registrada. Dias sem registro contam como dias sem treino — marcar a falta com o motivo deixa o resumo mais honesto.'}</p>`}
  </div>

  <div class="sec-title">Tendências ${perDo}</div>
  <div class="card tight">
    ${linha('Calorias consumidas', `média ${n0(mediaKcal)} kcal · meta ${n0(m.kcal)}`, tKcal)}
    ${linha('Volume de treino', `${n0(volTot)} kg ${per}`, tVol)}
    ${linha('Peso', pesos.length ? `${n1(pesos[pesos.length - 1].v)} kg no último registro` : 'sem registros', tPeso)}
    ${linha('Água', `média ${n1(mediaAgua / 1000)} L de ${n1(m.agua / 1000)} L`, tAgua)}
    ${linha('Adesão a hábitos', `${habFeito} de ${habPrev} check-ins`, tHab)}
    ${medPrev ? linha('Medicamentos', `${medTom} de ${medPrev} doses tomadas`, tMed) : ''}
    ${noites.length ? linha('Sono', `média ${n1(sonoMedia)} h de ${n1(metaSono())} h · ${noites.length} noite(s) registrada(s)`, tSono) : ''}
    <p class="mini" style="margin-top:8px">A tendência compara a média da 2ª metade do período com a da 1ª metade. Verde = evoluindo na direção do seu objetivo.</p>
  </div>

  <div class="card">
    <div class="ch"><span class="dot" style="background:var(--die)"></span><h2>Calorias por dia</h2>
      <span class="sub trend ${tKcal.cls}">${tKcal.txt}</span></div>
    ${chartBar(S.map(s => s.kcal), { cor: 'var(--die)', meta: m.kcal, labels })}
  </div>

  <div class="card">
    <div class="ch"><span class="dot" style="background:var(--tre)"></span><h2>Volume de treino (kg)</h2>
      <span class="sub trend ${tVol.cls}">${tVol.txt}</span></div>
    ${chartBar(S.map(s => s.vol), { cor: 'var(--tre)', labels })}
    <div class="legend"><span>${treinos} treino${treinos===1?'':'s'} concluído${treinos===1?'':'s'} ${per}</span></div>
  </div>

  <div class="card">
    <div class="ch"><span class="dot" style="background:var(--res)"></span><h2>Peso (kg)</h2>
      <span class="sub trend ${tPeso.cls}">${tPeso.txt}</span></div>
    ${pesos.length ? chartLine(pesos, { cor: 'var(--res)', n: ds.length, minRange: 2 })
      : `<div class="empty">Nenhuma pesagem ${per}. Uma por semana já desenha a curva.</div>`}
    ${(() => {
      /* A curva sozinha não responde a pergunta que se faz olhando pra ela:
         quanto mudou, em quanto tempo, e em que ritmo por semana. */
      if (pesos.length < 2) return pesos.length
        ? `<p class="mini" style="margin-top:6px">${n1(pesos[0].v)} kg em ${esc(dLabel(ds[pesos[0].i]))} —
           é a única pesagem ${per}. Com duas dá para ver o ritmo.</p>` : '';
      const pri = pesos[0], ult = pesos[pesos.length - 1];
      const delta = ult.v - pri.v;
      const dias = Math.max(1, diffDias(ds[pri.i], ds[ult.i]));
      const porSem = delta / (dias / 7);
      const cor = typeof corVariacao === 'function' ? corVariacao(delta) : 'var(--tx2)';
      return `<div class="kpi" style="margin-top:4px">
        <div><b style="color:${cor}">${(delta > 0 ? '+' : '') + n1(delta)}</b><span>kg ${per}</span></div>
        <div><b>${(porSem > 0 ? '+' : '') + n1(porSem)}</b><span>kg/semana</span></div>
        <div><b>${pesos.length}</b><span>${pesos.length === 1 ? 'pesagem' : 'pesagens'}</span></div>
      </div>
      <p class="mini" style="margin-top:7px">De <b>${n1(pri.v)} kg</b> em ${esc(dLabel(ds[pri.i]))}
        para <b>${n1(ult.v)} kg</b> em ${esc(dLabel(ds[ult.i]))} — ${plural(dias, 'dia', 'dias')} entre as duas.</p>`;
    })()}
    <div class="row" style="margin-top:4px" data-a="irPesagens"><div class="g">
      <div class="t">Todas as minhas pesagens</div>
      <div class="s">a curva completa, desde a primeira</div></div>
      <div class="v">${ic('dir', 16, 'op')}</div></div>
  </div>

  ${noites.length ? `<div class="card">
    <div class="ch"><span class="dot" style="background:var(--res)"></span><h2>Horas de sono</h2>
      <span class="sub trend ${tSono.cls}">${tSono.txt}</span></div>
    ${chartBar(S.map(s => s.sonoH || 0), { cor: 'var(--res)', meta: metaSono(), labels })}
    <div class="kpi" style="margin-top:4px">
      <div><b style="color:var(--res)">${n1(sonoMedia)}</b><span>horas por noite</span></div>
      <div><b>${sonoQmed ? n1(sonoQmed) + '/5' : '—'}</b><span>qualidade média</span></div>
      <div><b style="color:${sonoDespTot ? 'var(--warn)' : 'var(--ac)'}">${sonoDespTot}</b><span>despertares</span></div>
    </div>
    ${(() => {
      /* o cruzamento que interessa: como o corpo responde no dia seguinte a uma noite curta */
      const curtas = noites.filter(x => x.sonoH < metaSono() - 1);
      const boas = noites.filter(x => x.sonoH >= metaSono() - .5);
      const mediaKc = l => { const c = l.filter(x => x.kcal > 0); return c.length ? c.reduce((a, x) => a + x.kcal, 0) / c.length : 0; };
      const treinou = l => l.length ? l.filter(x => x.treino).length / l.length * 100 : 0;
      if (curtas.length < 2 || boas.length < 2) return `<p class="mini">Com mais noites registradas
        eu passo a comparar aqui o que muda no seu dia depois de dormir pouco.</p>`;
      return `<div class="sec-title" style="margin:16px 4px 8px">Depois de dormir pouco</div>
        <div class="row"><div class="g"><div class="t">Calorias no dia</div>
          <div class="s">noites boas: ${n0(mediaKc(boas))} kcal</div></div>
          <div class="v">${n0(mediaKc(curtas))} kcal</div></div>
        <div class="row"><div class="g"><div class="t">Treinou</div>
          <div class="s">noites boas: ${n0(treinou(boas))}%</div></div>
          <div class="v">${n0(treinou(curtas))}%</div></div>
        <p class="mini" style="margin-top:8px">Compara os ${curtas.length} dia(s) após noite curta
        (menos de ${n1(metaSono() - 1)} h) com os ${boas.length} dia(s) após noite completa.</p>`;
    })()}
  </div>` : ''}

  <div class="card">
    <div class="ch"><span class="dot" style="background:var(--agua)"></span><h2>Água (ml)</h2>
      <span class="sub trend ${tAgua.cls}">${tAgua.txt}</span></div>
    ${chartBar(S.map(s => s.agua), { cor: 'var(--agua)', meta: m.agua, labels })}
  </div>

  <div class="card">
    <div class="ch"><span class="dot" style="background:var(--hab)"></span><h2>Adesão a hábitos (%)</h2>
      <span class="sub trend ${tHab.cls}">${tHab.txt}</span></div>
    ${chartBar(S.map(s => s.habPrev ? s.habFeito / s.habPrev * 100 : 0), { cor: 'var(--hab)', max: 100, meta: 100, labels })}
    ${DB.habitos.filter(h => h.ativo !== false).map(h => {
        const ds = passados.filter(s => habDevidoEm(h, s.d)).map(s => s.d);
        const vz = vezesHab(h).length;
        const prev = ds.length * vz;
        const fez = ds.reduce((a, d) => a + vezesHab(h).filter(v => slotFeito(d, h, v)).length, 0);
        const completos = ds.filter(d => habCompleto(d, h)).length;
        return `<div class="row"><div class="g"><div class="t">${icOu(h.icone, 15)} ${esc(h.nome)}</div>
        <div class="s">${vz > 1 ? `${fez} de ${prev} check-ins · ${completos} ${completos === 1 ? 'dia completo' : 'dias completos'}`
          : `${fez} de ${prev} dias`}</div></div>
        <div class="v">${prev ? n0(fez / prev * 100) : 0}%</div></div>`;
      }).join('')}
  </div>

  ${medPrev ? `<div class="card">
    <div class="ch"><span class="dot" style="background:var(--lem)"></span><h2>Medicamentos tomados (%)</h2>
      <span class="sub trend ${tMed.cls}">${tMed.txt}</span></div>
    ${chartBar(S.map(s => s.medPrev ? s.medTom / s.medPrev * 100 : 0), { cor: 'var(--lem)', max: 100, meta: 100, labels })}
    ${(DB.medicamentos || []).filter(mm => mm.ativo !== false).map(mm => {
        let prev = 0, tom = 0;
        passados.forEach(s => {
          if (!medDevidoEm(mm, s.d)) return;
          dosesDe(mm).forEach(hh => { prev++; if (medTomado(s.d, mm.id, hh)) tom++; });
        });
        if (!prev) return '';
        return `<div class="row"><div class="g"><div class="t wrap">${esc(mm.nome)}</div>
          <div class="s">${tom} de ${prev} doses</div></div>
          <div class="v">${n0(tom / prev * 100)}%</div></div>`;
      }).join('')}
    <div class="legend"><span>Dias sem registro contam como dose não tomada.</span></div>
  </div>` : ''}

  ${refTotal ? `<div class="card">
    <div class="ch"><span class="dot" style="background:var(--die)"></span><h2>Calorias por refeição</h2>
      <span class="sub">média dos dias com registro</span></div>
    ${REFS.filter(r => refMedia[r[0]] > 0).map(r => {
        const tot = passados.reduce((a, s) => a + s.refs[r[0]], 0);
        return `<div style="margin-bottom:9px">
        <div class="mt"><span>${ic(r[2], 13)} ${r[1]}</span>
          <span>${n0(refMedia[r[0]])} kcal · ${n0(tot / refTotal * 100)}%</span></div>
        ${bar(refMedia[r[0]], Math.max(...REFS.map(q => refMedia[q[0]])), r[0] === 'livre' ? 'var(--warn)' : 'var(--die)')}</div>`;
      }).join('')}
    <p class="mini">O percentual é a fatia daquela refeição no total de calorias ${perDo}.</p>
  </div>` : ''}

  ${espLista.length ? `<div class="card">
    <div class="ch"><span class="dot" style="background:var(--tre)"></span><h2>Atividades e esportes</h2>
      <span class="sub">${n0(espMinTot)} min ${per}</span></div>
    ${espLista.map(([nome, v]) => `<div class="row">
      <div class="g"><div class="t wrap">${esc(nome)}</div>
        <div class="s">${v.n}× · ${n0(v.kcal)} kcal</div></div>
      <div class="v">${n0(v.min)} min</div></div>`).join('')}
  </div>` : ''}

  ${opt.escala === 'mes' ? `<div class="card">
    <div class="ch"><span class="dot" style="background:var(--res)"></span><h2>Por dia da semana</h2>
      <span class="sub">onde você rende mais</span></div>
    ${porDow.filter(w => w.n).map(w => `<div class="row">
      <div class="g"><div class="t">${w.nome}</div>
        <div class="s">${w.tre} de ${w.n} dias com treino${w.kcal ? ' · média ' + n0(w.kcal) + ' kcal' : ''}</div></div>
      <div class="v">${n0(w.n ? w.tre / w.n * 100 : 0)}%</div></div>`).join('')}
    <p class="mini">Serve para escolher em que dias vale marcar treino: o dia em que você
    mais falha costuma ser o dia errado na agenda, não falta de vontade.</p>
  </div>` : ''}

  <div class="card" style="margin-bottom:14px">
    <div class="ch"><h2>Macros médios ${perDo}</h2></div>
    ${(() => {
        const dd = passados.filter(s => s.kcal > 0), k = dd.length || 1;
        const mc = dd.reduce((a, s) => a + s.c, 0) / k, mp = dd.reduce((a, s) => a + s.p, 0) / k, mg = dd.reduce((a, s) => a + s.g, 0) / k;
        return `<div class="macro" style="flex-direction:column;gap:10px">
        ${[['Carboidrato', mc, m.c, 'var(--carb)'], ['Proteína', mp, m.p, 'var(--prot)'], ['Gordura', mg, m.g, 'var(--gord)']].map(r =>
          `<div><div class="mt"><span>${r[0]}</span><span>${n0(r[1])} / ${n0(r[2])} g</span></div>${bar(r[1], r[2], r[3])}</div>`).join('')}</div>`;
      })()}
  </div></div>`;
}

/* =========================================================
   EXPORTAR PLANILHA
   Gera um CSV com uma linha por dia. CSV abre no Excel, no
   Google Sheets e no Numbers sem nada instalado.
   Separador ";" e vírgula decimal, que é como o Excel em
   português espera; BOM no começo para os acentos saírem certos.
   ========================================================= */
const csvNum = v => (v == null || v === '' ? '' : String(v).replace('.', ','));
const csvTxt = v => {
  const t = String(v == null ? '' : v);
  return /[;"\n]/.test(t) ? '"' + t.replace(/"/g, '""') + '"' : t;
};

function planilhaDias(ds) {
  const m = metas();
  const cab = ['Data', 'Dia da semana', 'Treino', 'Exercícios feitos', 'Volume (kg)', 'Duração (min)',
    'Faltou', 'Motivo da falta',
    'Atividades', 'Kcal atividades', 'Kcal consumidas', 'Meta kcal', 'Carboidrato (g)', 'Proteína (g)',
    'Gordura (g)', 'Escapes (kcal)', 'Água (ml)', 'Meta água (ml)', 'Gasto estimado (kcal)',
    'Balanço (kcal)', 'Peso (kg)', 'Check-ins de hábito feitos', 'Check-ins previstos',
    'Doses tomadas', 'Doses previstas', 'Medicamentos tomados',
    'Dormiu às', 'Acordou às', 'Horas de sono', 'Qualidade do sono', 'Despertares', 'Sono - observação',
    'Anotação'];
  const linhas = [cab.join(';')];
  ds.forEach(d => {
    const x = DB.dias[d]; if (!x || diaVazio(x)) return;
    const t = somaDia(d), g = gastoDia(d);
    const habs = DB.habitos.filter(h => habDevidoEm(h, d));
    const ckd = habChecks(d, habs), hf = ckd.feitos;
    const tr = treinoDoDia(d), fa = faltaDoDia(d);
    const sn = x.sono;
    const ms = medStats(d), tomList = [];
    let tomAvulsas = 0;
    Object.keys(x.meds || {}).forEach(id => {
      const mm = medById(id), r = x.meds[id] || {};
      if (!mm || !(r.tomados || []).length) return;
      tomList.push(mm.nome + ' ' + (r.tomados || []).join(','));
      if (!medDevidoEm(mm, d)) tomAvulsas += r.tomados.length;
    });
    linhas.push([
      d, DOW[parseD(d).getDay()],
      csvTxt(tr ? tr.nome + (tr.feito ? '' : ' (em aberto)') : fa ? 'Falta' : ''),
      tr ? tr.itens.filter(i => i.feito).length + '/' + tr.itens.length : '',
      csvNum(volDia(d) || ''), tr ? tr.duracao || '' : '',
      fa ? 'sim' : '', csvTxt(fa ? (fa.obs || fa.motivo) : ''),
      csvTxt((x.esportes || []).map(e => e.nome + ' ' + e.min + 'min').join(' | ')),
      (x.esportes || []).reduce((a, e) => a + e.kcal, 0) || '',
      Math.round(t.kcal) || '', Math.round(m.kcal),
      csvNum(+t.c.toFixed(1)), csvNum(+t.p.toFixed(1)), csvNum(+t.g.toFixed(1)),
      Math.round(t.escape || 0) || '', x.agua || '', metaAguaDia(d),
      Math.round(g.total), Math.round(t.kcal - g.total),
      csvNum(x.peso || ''), ckd.prev ? hf : '', ckd.prev || '',
      ms.prev || tomList.length ? ms.tom + tomAvulsas : '', ms.prev || '',
      csvTxt(tomList.join(' | ')),
      sn ? sn.deitou : '', sn ? sn.acordou : '', sn ? csvNum(+(sonoMin(sn) / 60).toFixed(2)) : '',
      sn && sn.qual ? sn.qual : '', sn ? (sn.despertares || 0) : '', csvTxt(sn ? sn.nota || '' : ''),
      csvTxt(x.nota || '')
    ].join(';'));
  });
  return linhas.join('\r\n');
}

function periodoDias(tipo) {
  if (tipo === 'sem') return diasDaSemana(semanaAtual());
  if (tipo === 'mes') {
    const ref = SUB.mes ? parseD(SUB.mes + '-01') : parseD(D);
    return diasDoMes(ref.getFullYear(), ref.getMonth());
  }
  if (tipo === '30') { const o = []; for (let i = 29; i >= 0; i--) o.push(addDays(today(), -i)); return o; }
  return Object.keys(DB.dias).sort();
}

/* =========================================================
   SUPABASE — conta e sincronização

   IDENTIDADE
   Cada linha do banco tem um dono (user_id) e o RLS só devolve
   as linhas de quem está pedindo. Por isso a conta precisa ser
   A MESMA em todos os aparelhos: entrar com e-mail resolve.
   A sessão anônima cria um usuário novo por aparelho — serve
   para uso em um aparelho só, nunca para sincronizar.

   CONFLITOS
   Last-write-wins por registro, comparando o campo "upd".
   Registros sem "upd" (dia aberto mas nunca lançado, perfil
   nunca editado) NUNCA são enviados: eram eles que apagavam
   os dados bons do servidor.
   ========================================================= */
const SB = { client: null, user: null, email: null, anon: false, status: 'desconectado' };
function syncBadge() {
  const e = document.getElementById('sb_status'); if (e) e.textContent = SB.status;
}
const logado = () => !!(SB.client && SB.user);

async function iniciarSupabase(manual) {
  const { url, key } = DB.cfg;
  if (!url || !key) { SB.status = 'não configurado'; syncBadge(); return; }
  if (!window.supabase) { SB.status = 'sem conexão'; syncBadge(); return; }
  try {
    SB.status = 'conectando…'; syncBadge();
    if (!SB.client) {
      SB.client = window.supabase.createClient(url, key, {
        auth: {
          persistSession: true, autoRefreshToken: true, detectSessionInUrl: true,
          // implicit: o link do e-mail funciona mesmo aberto pelo navegador
          // interno do app de e-mail, que não compartilha dados com o Chrome/Safari
          flowType: 'implicit', storageKey: 'vitta_auth'
        }
      });
      SB.client.auth.onAuthStateChange((evento, sessao) => {
        if (evento === 'SIGNED_IN' && sessao) {
          limparURL(); aplicarSessao(sessao); fechar(); syncAll(true);
        }
        if (evento === 'SIGNED_OUT') {
          SB.user = SB.email = null; SB.anon = false; SB.status = 'sem conta';
          DB.cfg.temConta = false; save(false); syncBadge();
        }
      });
    }
    const { data: { session } } = await SB.client.auth.getSession();
    if (!session) { SB.user = null; SB.status = 'sem conta'; syncBadge(); render(); return; }
    limparURL(); aplicarSessao(session);
    await syncAll(manual);
  } catch (e) {
    SB.status = 'erro: ' + (e.message || e); syncBadge();
    if (manual) toast('Falha ao conectar. Confira URL/chave.');
    console.error('[supabase]', e);
  }
}
/* tira os tokens do endereço depois que o link do e-mail é usado */
function limparURL() {
  if (location.hash && /access_token|error_description/.test(location.hash)) {
    try { history.replaceState(null, '', location.pathname + location.search); } catch (e) { }
  }
}
function aplicarSessao(session) {
  SB.user = session.user.id;
  SB.email = session.user.email || null;
  SB.anon = !!session.user.is_anonymous || !session.user.email;
  SB.status = 'conectado'; syncBadge();
  /* conta de verdade: guarda a marca para as boas-vindas não voltarem */
  const tinha = DB.cfg.temConta;
  DB.cfg.temConta = !SB.anon;
  if (DB.cfg.temConta !== tinha) save(false);
  if (DB.cfg.temConta && VIEW === 'boasVindas') go('hoje');
}

/* ---------- entrar com e-mail ----------
   Dois caminhos, e o app aceita os dois:
   1. tocar no link que chega no e-mail (funciona sem configurar nada);
   2. digitar o código de 6 dígitos (só aparece se o modelo de e-mail do
      Supabase tiver a variável do token — o que exige SMTP próprio nos
      projetos gratuitos novos).                                          */
const URL_APP = () => location.origin + location.pathname;

/* O serviço de e-mail que vem junto do Supabase é de teste: poucas
   mensagens por hora no projeto inteiro. Depurar login estoura esse teto
   em minutos — e aí não há link nem código que chegue. Por isso a senha
   é o caminho principal: ela não manda e-mail nenhum. */
const emailOk = e => /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(e);
const ESPERA_EMAIL = 60000;
function faltaEsperar() {
  const t = DB.cfg.ultimoEnvio || 0;
  const f = Math.ceil((ESPERA_EMAIL - (Date.now() - t)) / 1000);
  return f > 0 && f <= 60 ? f : 0;
}
/* Mensagem do Supabase vem em inglês e sem contexto. Traduzir aqui é o que
   transforma "over_email_send_rate_limit" em algo acionável. */
function erroAuth(err) {
  const m = String((err && (err.message || err.msg)) || err || '');
  const cod = String((err && err.code) || '');
  if (/rate limit|over_email_send_rate/i.test(m) || cod === 'over_email_send_rate_limit')
    return 'Limite de e-mails do Supabase estourado. O serviço de e-mail que vem de fábrica manda '
      + 'poucas mensagens por hora. Espere uma hora — ou entre com senha, que não manda e-mail nenhum.';
  const seg = m.match(/after (\d+) seconds?/i);
  if (seg) return `Espere ${seg[1]} segundos antes de pedir de novo.`;
  if (/Invalid login credentials/i.test(m)) return 'E-mail ou senha não conferem';
  if (/Email not confirmed/i.test(m)) return 'Esta conta ainda não foi confirmada por e-mail';
  if (/already registered|already been registered|user_already_exists/i.test(m))
    return 'Já existe conta com este e-mail. Use “Entrar” com a sua senha';
  if (/Password should be at least|weak.?password/i.test(m)) return 'Senha curta ou fraca demais';
  if (/Signups not allowed|signup_disabled/i.test(m)) return 'A criação de contas está desligada neste projeto do Supabase';
  if (/Failed to fetch|NetworkError/i.test(m)) return 'Sem conexão com o Supabase';
  return 'Erro: ' + m;
}

/* ---------- entrar colando o link ----------
   Aceita as duas formas em que o acesso aparece:
   · o link do e-mail, ainda não aberto  → .../verify?token=…&type=magiclink
   · o endereço da barra do navegador     → …/vitta/#access_token=…&refresh_token=…
   O primeiro é de uso único: se você já tocou nele, ele não serve mais —
   aí o que vale é copiar da barra do navegador.                             */
async function sessaoDoLink(bruto) {
  let u;
  try { u = new URL(bruto.trim()); } catch (e) { return { msg: 'Isso não parece um link' }; }
  const q = new URLSearchParams(u.search);
  const h = new URLSearchParams((u.hash || '').replace(/^#/, ''));
  const pega = k => h.get(k) || q.get(k);

  const erro = pega('error_description') || pega('error');
  const at = pega('access_token'), rt = pega('refresh_token');
  if (at && rt) {
    const { data, error } = await SB.client.auth.setSession({ access_token: at, refresh_token: rt });
    if (error || !data.session) return { msg: 'O acesso desse link já expirou — peça um novo' };
    return { sessao: data.session };
  }
  if (erro) return { msg: decodeURIComponent(erro).replace(/\+/g, ' ') };

  const th = pega('token_hash') || pega('token');
  if (th) {
    const tipos = [pega('type'), 'magiclink', 'email', 'signup'].filter(Boolean);
    for (const t of tipos) {
      const r = await SB.client.auth.verifyOtp({ token_hash: th, type: t });
      if (!r.error && r.data && r.data.session) return { sessao: r.data.session };
    }
    return { msg: 'Link já usado ou expirado. Peça outro e copie sem abrir' };
  }
  return { msg: 'Não encontrei o acesso nesse link' };
}

ACT.confirmarCodigo = async e => {
  const token = valOf('au_cod').replace(/\D/g, ''), email = e.dataset.m;
  if (token.length < 6) return toast('O código tem 6 dígitos — ou use o link do e-mail');
  e.textContent = 'Entrando…';
  // e-mail novo chega pelo modelo "Confirm signup" (type signup);
  // e-mail que já existe chega pelo "Magic Link" (type email). Tenta os dois.
  let sessao = null, ultimo = null;
  for (const tipo of ['email', 'signup', 'magiclink']) {
    const r = await SB.client.auth.verifyOtp({ email, token, type: tipo });
    if (!r.error && r.data && r.data.session) { sessao = r.data.session; break; }
    ultimo = r.error;
  }
  if (!sessao) {
    e.textContent = 'Entrar com o código';
    console.error('[auth]', ultimo);
    return toast('Código inválido ou expirado');
  }
  aplicarSessao(sessao);
  fechar(); toast('Conectado como ' + email);
  await syncAll(true);
};
