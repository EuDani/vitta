name: Gerar o APK do Vitta

# Roda sozinho a cada envio para o GitHub, e também quando você clicar
# em "Run workflow" na aba Actions. O APK sai como arquivo para baixar.
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Leva o app (index.html e sw.js) para dentro do APK, para ele
      # funcionar mesmo sem internet.
      - name: Copiar o app para dentro do APK
        run: |
          mkdir -p android/app/src/main/assets
          cp index.html android/app/src/main/assets/index.html
          cp sw.js      android/app/src/main/assets/sw.js
          ls -l android/app/src/main/assets

      - name: Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Montar o APK
        working-directory: android
        run: gradle --no-daemon assembleRelease

      - name: Publicar o APK
        uses: actions/upload-artifact@v4
        with:
          name: vitta-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
